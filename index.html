<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#0a0e1a">
<title>ClientDesk — Client & Payment Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0e1a; --surface:#121a2e; --surface2:#1a2440; --border:#22304f;
  --primary:#3b82f6; --primary2:#2563eb; --accent:#22d3ee;
  --text:#e6eefc; --muted:#8a9bb8;
  --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:10px 12px;
  background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;
  transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
input:invalid,select:invalid{border-color:var(--danger)}
::placeholder{color:#5a6b8a}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--surface);border-right:1px solid var(--border);
  position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;
  transition:transform .25s ease;display:flex;flex-direction:column}
.sidebar .brand{padding:20px 20px 16px;font-size:20px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;
  background-clip:text;color:transparent}
.sidebar nav{flex:1;padding:8px}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;
  color:var(--muted);font-weight:500;margin-bottom:2px;transition:background .15s,color .15s}
.sidebar nav a:hover{background:var(--surface2);color:var(--text)}
.sidebar nav a.active{background:linear-gradient(90deg,rgba(59,130,246,.18),rgba(34,211,238,.08));
  color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.sidebar .icon{width:20px;text-align:center;font-size:16px}
.sidebar .foot{padding:14px 20px;font-size:11px;color:var(--muted);border-top:1px solid var(--border)}
.main{flex:1;margin-left:250px;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:rgba(10,14,26,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:12px 20px}
.topbar h1{font-size:18px;margin:0;font-weight:700;flex-shrink:0}
.topbar .search{flex:1;max-width:420px;position:relative}
.topbar .search input{padding-left:34px;background:var(--surface)}
.topbar .search::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);
  font-size:13px;opacity:.6}
.hamburger{display:none;font-size:22px;padding:4px 8px}
.content{padding:20px;flex:1}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99}
.overlay.show{display:block}

/* Cards */
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;transition:border-color .15s}
.card.clickable{cursor:pointer}
.card.clickable:hover{border-color:var(--primary)}
.stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-value{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.stat-value.pos{color:var(--success)}
.stat-value.neg{color:var(--danger)}
.stat-value.warn{color:var(--warning)}
.stat-sub{font-size:12px;color:var(--muted);margin-top:4px}
.section-title{font-size:16px;font-weight:700;margin:24px 0 12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:9px;
  font-weight:600;font-size:13px;transition:transform .08s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--primary)}
.btn-danger{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.35)}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-success{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.35)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:7px}
.icon-btn{padding:6px 8px;border-radius:7px;font-size:14px;opacity:.75}
.icon-btn:hover{opacity:1;background:var(--surface2)}

/* Badges */
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;
  letter-spacing:.3px;white-space:nowrap}
.badge.gray{background:rgba(138,155,184,.15);color:#b4c1d9}
.badge.blue{background:rgba(59,130,246,.18);color:#93c5fd}
.badge.cyan{background:rgba(34,211,238,.18);color:#67e8f9}
.badge.green{background:rgba(16,185,129,.18);color:#6ee7b7}
.badge.yellow{background:rgba(245,158,11,.18);color:#fcd34d}
.badge.red{background:rgba(239,68,68,.18);color:#fca5a5}
.badge.purple{background:rgba(168,85,247,.18);color:#d8b4fe}

/* Tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;
  border:1px solid var(--border);background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  font-weight:700;background:var(--surface2);position:sticky;top:0}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--surface2)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* Empty states */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .icon{font-size:42px;margin-bottom:10px;opacity:.5}
.empty h3{margin:0 0 6px;color:var(--text);font-size:15px}
.empty p{margin:0 0 14px;font-size:13px}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;
  color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.form-grid label.full{grid-column:1/-1}
.form-grid label input,.form-grid label select,.form-grid label textarea{
  text-transform:none;letter-spacing:0;font-weight:400;color:var(--text)}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;
  padding-top:16px;border-top:1px solid var(--border)}
.form-error{color:var(--danger);font-size:12px;margin-top:8px;display:none}
.form-error.show{display:block}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;
  align-items:flex-end;justify-content:center;padding:0;overflow-y:auto;animation:fade .2s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;
  width:100%;max-width:640px;max-height:92vh;overflow-y:auto;animation:slideUp .25s}
.modal.wide{max-width:820px}
@keyframes fade{from{opacity:0}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.modal-header h2{margin:0;font-size:17px;font-weight:700}
.modal-body{padding:18px 20px 22px}
@media(min-width:640px){
  .modal-overlay{align-items:center;padding:20px}
  .modal{border-radius:16px}
}

/* Toast */
#toasts{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface2);border:1px solid var(--border);padding:11px 16px;border-radius:10px;
  font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:slideIn .25s;
  max-width:320px}
.toast.success{border-color:rgba(16,185,129,.4)}
.toast.error{border-color:rgba(239,68,68,.4)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}}

/* Tabs / filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filters input,.filters select{padding:8px 10px;font-size:13px;width:auto;min-width:140px}
.chip{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--border);
  background:var(--surface2);color:var(--muted);cursor:pointer;transition:.15s}
.chip.active{background:rgba(59,130,246,.2);color:#93c5fd;border-color:var(--primary)}

/* Progress */
.progress{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:8px}
.progress > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));
  border-radius:99px;transition:width .4s}

/* Client profile header */
.profile-head{background:linear-gradient(135deg,var(--surface),var(--surface2));
  border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.profile-head h2{margin:0 0 6px;font-size:22px}
.profile-head .meta{color:var(--muted);font-size:13px}

/* Chart */
.chart-box{position:relative;height:260px;padding:10px}
.chart-box canvas{max-height:100%}

/* Responsive */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:block}
  .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr}
  .content{padding:14px}
  .topbar h1{font-size:16px}
}

/* Mobile 2x2 Grid Fix */
@media(max-width:520px){
  .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:repeat(2,1fr);gap:10px}
  .form-grid{grid-template-columns:1fr}
  .topbar .search{display:none}
  
  .grid.cols-4 .card { 
    padding: 16px 10px; 
    min-height: 105px; 
    display: flex; 
    flex-direction: column; 
    justify-content: center; 
    align-items: center; 
    text-align: center; 
  }
  .grid.cols-4 .stat-value { font-size: 18px; margin-top: 4px; }
  .grid.cols-4 .stat-label { font-size: 10px; line-height: 1.2; letter-spacing: 0; }
}

.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}.gap{gap:10px}
.hidden{display:none}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">ClientDesk</div>
    <nav id="nav"></nav>
    <div class="foot">
      <div id="sync-status" style="margin-bottom:8px;">Mode: <span style="color:var(--warning)">Connecting...</span></div>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <h1 id="page-title">Dashboard</h1>
      <div class="search"><input id="global-search" placeholder="Search clients, phone, projects…" autocomplete="off"></div>
      <button class="btn btn-primary" id="quick-add">+ New</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="toasts"></div>

<script>
'use strict';

/* ============================================================
   CONFIGURATION (Tumhari Keys yahan daal di gayi hain)
   ============================================================ */
const SUPABASE_URL = 'https://vysxnpnxfonafcnylxmu.supabase.co'; 
const SUPABASE_KEY = 'sb_publishable_KD73RIU-GxjcyqnEtR-AiQ_EQxL5PZF'; 

/* ============================================================
   ClientDesk — Complete Client & Payment Tracker
   ============================================================ */

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtMoney = n => '₹' + (Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtMoneyS = n => '₹' + (Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const fmtDate = d => { if(!d) return '—'; const dt = new Date(d); if(isNaN(dt)) return '—';
  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a))/86400000);

function toast(msg, type='success'){
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2800);
}

function confirmAction(msg){
  return new Promise(res => {
    const o = document.createElement('div');
    o.className = 'modal-overlay';
    o.innerHTML = `<div class="modal" style="max-width:420px">
      <div class="modal-header"><h2>Confirm</h2></div>
      <div class="modal-body">
        <p style="margin:0 0 16px;color:var(--muted)">${esc(msg)}</p>
        <div class="form-actions">
          <button class="btn btn-ghost" data-no>Cancel</button>
          <button class="btn btn-danger" data-yes>Confirm</button>
        </div>
      </div></div>`;
    document.body.appendChild(o);
    o.querySelector('[data-no]').onclick = () => { o.remove(); res(false); };
    o.querySelector('[data-yes]').onclick = () => { o.remove(); res(true); };
    o.addEventListener('click', e => { if(e.target===o){ o.remove(); res(false);} });
  });
}

function openModal(title, bodyHtml, opts={}){
  const o = document.createElement('div');
  o.className = 'modal-overlay';
  o.innerHTML = `<div class="modal ${opts.wide?'wide':''}">
    <div class="modal-header"><h2>${esc(title)}</h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="modal-body">${bodyHtml}</div>
  </div>`;
  document.body.appendChild(o);
  const close = () => o.remove();
  o.querySelector('[data-close]').onclick = close;
  o.addEventListener('click', e => { if(e.target===o) close(); });
  return { overlay:o, close, body:o.querySelector('.modal-body') };
}

/* ---------- DB / Supabase Logic ---------- */
let supabaseClient = null;
let useCloud = false;

if (SUPABASE_URL && SUPABASE_KEY) {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  useCloud = true;
}

// Local fallback IndexedDB
const DB_NAME='clientdesk_v1', DB_VERSION=1;
let _db;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      ['clients','projects','payments','expenses','followups','audit'].forEach(s=>{
        if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id'});
      });
    };
    r.onsuccess = e => { _db = e.target.result; res(_db); };
    r.onerror = e => rej(e.target.error);
  });
}

const dbAll = async (store) => {
  if (useCloud) {
    const { data, error } = await supabaseClient.from(store).select('*');
    if (error) { console.error(error); return []; }
    return data || [];
  } else {
    return new Promise((res,rej)=>{ const r=_db.transaction(store).objectStore(store).getAll();
      r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); });
  }
};

const dbPut = async (store,obj) => {
  if (useCloud) {
    const { data, error } = await supabaseClient.from(store).upsert(obj);
    if (error) throw new Error(error.message);
    return obj;
  } else {
    return new Promise((res,rej)=>{ const r=_db.transaction(store,'readwrite').objectStore(store).put(obj);
      r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error); });
  }
};

const dbDel = async (store,id) => {
  if (useCloud) {
    const { error } = await supabaseClient.from(store).delete().eq('id', id);
    if (error) throw new Error(error.message);
  } else {
    return new Promise((res,rej)=>{ const r=_db.transaction(store,'readwrite').objectStore(store).delete(id);
      r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
  }
};

const dbClear = async (store) => {
  if (useCloud) {
    const { error } = await supabaseClient.from(store).delete().neq('id', '00000000-0000-0000-0000-000000000000');
    if (error) throw new Error(error.message);
  } else {
    return new Promise((res,rej)=>{ const r=_db.transaction(store,'readwrite').objectStore(store).clear();
      r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
  }
};

/* ---------- State & Load ---------- */
const S = { clients:[], projects:[], payments:[], expenses:[], followups:[], audit:[] };
async function loadAll(){
  if (useCloud) {
    [S.clients,S.projects,S.payments,S.expenses,S.followups] = await Promise.all(
      ['clients','projects','payments','expenses','followups'].map(dbAll));
    S.audit = []; 
  } else {
    [S.clients,S.projects,S.payments,S.expenses,S.followups,S.audit] = await Promise.all(
      ['clients','projects','payments','expenses','followups','audit'].map(dbAll));
  }
}

async function nextDisplayId(store, prefix){
  const all = await dbAll(store);
  let max = 0;
  all.forEach(r => { const m = (r.displayId||'').match(/(\d+)$/); if(m) max = Math.max(max, +m[1]); });
  return prefix + '-' + String(max+1).padStart(4,'0');
}

async function auditLog(entity, entityId, action, details){
  if (!useCloud) {
    await dbPut('audit', { id:uid(), timestamp:new Date().toISOString(), entity, entityId, action, details });
  }
}

/* ---------- Calculations ---------- */
const Calc = {
  projReceived(projectId){
    return S.payments.filter(p => p.projectId===projectId && p.status==='Confirmed')
      .reduce((s,p)=> s + (p.type==='Refund' ? -p.amount : p.amount), 0);
  },
  projBalance(project){ return (project.agreedPrice||0) - Calc.projReceived(project.id); },
  projExpenses(project){
    const linked = S.expenses.filter(e=>e.projectId===project.id).reduce((s,e)=>s+(e.amount||0),0);
    return (project.domainCost||0)+(project.hostingCost||0)+(project.otherExpenses||0)+linked;
  },
  projNet(project){ return Calc.projReceived(project.id) - Calc.projExpenses(project); },
  projPayStatus(project){
    const rec = Calc.projReceived(project.id);
    if(rec<=0) return 'Unpaid';
    if(rec < project.agreedPrice) return 'Partially Paid';
    if(rec === project.agreedPrice) return 'Paid';
    return 'Overpaid';
  },
  clientProjects(clientId){ return S.projects.filter(p=>p.clientId===clientId); },
  clientAgreed(clientId){ return Calc.clientProjects(clientId).reduce((s,p)=>s+(p.agreedPrice||0),0); },
  clientReceived(clientId){
    return S.payments.filter(p=>p.clientId===clientId && p.status==='Confirmed')
      .reduce((s,p)=>s+(p.type==='Refund'?-p.amount:p.amount),0);
  },
  clientExpenses(clientId){
    const direct = S.expenses.filter(e=>e.clientId===clientId).reduce((s,e)=>s+(e.amount||0),0);
    const proj = Calc.clientProjects(clientId).reduce((s,p)=>
      s+(p.domainCost||0)+(p.hostingCost||0)+(p.otherExpenses||0),0);
    return direct + proj;
  },
  clientOutstanding(clientId){ return Calc.clientAgreed(clientId) - Calc.clientReceived(clientId); },
  totalAgreed(){ return S.projects.filter(p=>p.status!=='Cancelled').reduce((s,p)=>s+(p.agreedPrice||0),0); },
  totalReceived(){ return S.payments.filter(p=>p.status==='Confirmed')
      .reduce((s,p)=>s+(p.type==='Refund'?-p.amount:p.amount),0); },
  totalExpenses(){
    const e = S.expenses.reduce((s,x)=>s+(x.amount||0),0);
    const p = S.projects.reduce((s,x)=>s+(x.domainCost||0)+(x.hostingCost||0)+(x.otherExpenses||0),0);
    return e + p;
  },
  totalOutstanding(){ return S.projects.reduce((s,p)=>{ const b=Calc.projBalance(p); return s + (b>0?b:0); },0); },
  netCash(){ return Calc.totalReceived() - Calc.totalExpenses(); },
  overdueAmount(){
    const today = todayStr();
    return S.projects.reduce((s,p)=>{
      const b = Calc.projBalance(p);
      return s + (b>0 && p.deadline && p.deadline < today ? b : 0);
    },0);
  },
  activeProjects(){ return S.projects.filter(p=>['Not Started','In Progress','Waiting for Client','Revision'].includes(p.status)); },
  completedProjects(){ return S.projects.filter(p=>['Completed','Delivered'].includes(p.status)); },
  upcomingDeadlines(days=14){
    const today = todayStr();
    return S.projects.filter(p=>p.deadline && p.deadline>=today && p.deadline<=addDays(today,days) &&
      !['Completed','Delivered','Cancelled'].includes(p.status));
  },
  followupsDueToday(){
    const today = todayStr();
    return S.followups.filter(f=>f.status==='Pending' && f.date<=today);
  }
};
function addDays(dateStr, n){ const d=new Date(dateStr); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

/* ---------- Charts ---------- */
let chartInstances = {};
function destroyCharts(){ Object.values(chartInstances).forEach(c=>c&&c.destroy()); chartInstances={}; }
function makeChart(id, config){
  const el = document.getElementById(id); if(!el) return;
  chartInstances[id] = new Chart(el, config);
}

function route(){
  const hash = location.hash.slice(1) || '/dashboard';
  const parts = hash.split('/').filter(Boolean);
  const name = parts[0] || 'dashboard';
  const fn = routes[name] || renderDashboard;
  destroyCharts();
  fn(parts.slice(1));
  $$('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.route===name));
  $('#sidebar').classList.remove('open');
  $('#overlay').classList.remove('show');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

      </div>

function emptyChart(id, msg){
  const el = document.getElementById(id);
  if(!el) return;
  el.parentElement.innerHTML = `<div class="empty" style="padding:80px 20px"><div class="icon">📭</div><p>${esc(msg)}</p></div>`;
}
function last6Months(){
  const arr=[]; const d=new Date();
  for(let i=5;i>=0;i--){ const x=new Date(d.getFullYear(), d.getMonth()-i, 1); arr.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')); }
  return arr;
}
function statCard(label, value, sub, cls=''){
  return `<div class="card"><div class="stat-label">${esc(label)}</div><div class="stat-value ${cls}">${esc(String(value))}</div>${sub?`<div class="stat-sub">${esc(sub)}</div>`:''}</div>`;
}

function renderClients(parts){
  $('#page-title').textContent = 'Clients';
  const params = new URLSearchParams((location.hash.split('?')[1])||'');
  let q = params.get('q') || '';
  let category = params.get('cat') || '';
  let status = params.get('status') || '';
  let sort = params.get('sort') || 'newest';
  let showArchived = params.get('arch') === '1';

  let list = S.clients.filter(c => showArchived ? c.archived : !c.archived);
  if(q){
    const ql = q.toLowerCase();
    list = list.filter(c => (c.name||'').toLowerCase().includes(ql) || (c.owner||'').toLowerCase().includes(ql) || (c.mobile||'').includes(ql) || (c.displayId||'').toLowerCase().includes(ql) || S.projects.some(p=>p.clientId===c.id && (p.name||'').toLowerCase().includes(ql)));
  }
  if(category) list = list.filter(c=>c.category===category);
  if(status) list = list.filter(c=>c.status===status);
  list.sort((a,b)=>{
    if(sort==='newest') return (b.createdAt||'').localeCompare(a.createdAt||'');
    if(sort==='oldest') return (a.createdAt||'').localeCompare(b.createdAt||'');
    if(sort==='outstanding') return Calc.clientOutstanding(b.id)-Calc.clientOutstanding(a.id);
    if(sort==='deadline'){
      const da = Math.min(...Calc.clientProjects(a.id).map(p=>p.deadline?new Date(p.deadline).getTime():Infinity));
      const db = Math.min(...Calc.clientProjects(b.id).map(p=>p.deadline?new Date(p.deadline).getTime():Infinity));
      return da-db;
    }
    if(sort==='payment'){
      const pa = Math.max(0,...S.payments.filter(p=>p.clientId===a.id).map(p=>new Date(p.date||0).getTime()));
      const pb = Math.max(0,...S.payments.filter(p=>p.clientId===b.id).map(p=>new Date(p.date||0).getTime()));
      return pb-pa;
    }
    return 0;
  });

  const categories = [...new Set(S.clients.map(c=>c.category).filter(Boolean))];
  const statuses = ['Lead','Contacted','Interested','Confirmed','Active','Completed','Cancelled'];

  $('#content').innerHTML = `
    <div class="filters">
      <input id="f-q" placeholder="Search clients…" value="${esc(q)}">
      <select id="f-cat"><option value="">All categories</option>${categories.map(c=>`<option ${category===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <select id="f-status"><option value="">All statuses</option>${statuses.map(s=>`<option ${status===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
      <select id="f-sort">
        <option value="newest" ${sort==='newest'?'selected':''}>Newest first</option>
        <option value="oldest" ${sort==='oldest'?'selected':''}>Oldest first</option>
        <option value="outstanding" ${sort==='outstanding'?'selected':''}>Highest outstanding</option>
        <option value="deadline" ${sort==='deadline'?'selected':''}>Nearest deadline</option>
        <option value="payment" ${sort==='payment'?'selected':''}>Latest payment</option>
      </select>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer"><input type="checkbox" id="f-arch" ${showArchived?'checked':''} style="width:auto"> Show archived</label>
      <button class="btn btn-primary" onclick="openClientForm()">+ Add Client</button>
    </div>
    ${list.length ? `
      <div class="table-wrap"><table><thead><tr><th>ID</th><th>Client</th><th>Contact</th><th>Projects</th><th class="num">Outstanding</th><th>Status</th></tr></thead>
        <tbody>${list.map(c=>{
              const out = Calc.clientOutstanding(c.id); const pc = Calc.clientProjects(c.id).length;
              return `<tr onclick="location.hash='#/client/${c.id}'">
                <td><span class="badge gray">${esc(c.displayId)}</span></td>
                <td><strong>${esc(c.name)}</strong>${c.owner?`<div class="stat-sub">${esc(c.owner)}</div>`:''}</td>
                <td>${esc(c.mobile||'—')}<div class="stat-sub">${esc(c.city||'')}</div></td>
                <td>${pc}</td>
                <td class="num ${out>0?'':'pos'}" style="color:${out>0?'var(--warning)':'var(--success)'}">${fmtMoney(out)}</td>
                <td>${clientStatusBadge(c.status)}</td></tr>`;
            }).join('')}</tbody></table></div>` :
      `<div class="empty"><div class="icon">👥</div><h3>No clients yet</h3><p>Add your first client to get started.</p><button class="btn btn-primary" onclick="openClientForm()">+ Add Client</button></div>`}
  `;

  const updateUrl = () => {
    const p = new URLSearchParams();
    const qv = $('#f-q').value.trim(); if(qv) p.set('q',qv);
    if($('#f-cat').value) p.set('cat',$('#f-cat').value);
    if($('#f-status').value) p.set('status',$('#f-status').value);
    if($('#f-sort').value!=='newest') p.set('sort',$('#f-sort').value);
    if($('#f-arch').checked) p.set('arch','1');
    location.hash = '#/clients'+(p.toString()?'?'+p.toString():'');
  };
  $('#f-q').addEventListener('input', debounce(updateUrl, 250));
  $('#f-cat').addEventListener('change', updateUrl);
  $('#f-status').addEventListener('change', updateUrl);
  $('#f-sort').addEventListener('change', updateUrl);
  $('#f-arch').addEventListener('change', updateUrl);
}
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function clientStatusBadge(s){ const map = {Lead:'gray',Contacted:'blue',Interested:'cyan',Confirmed:'purple',Active:'green',Completed:'green',Cancelled:'red'}; return `<span class="badge ${map[s]||'gray'}">${esc(s||'—')}</span>`; }
function projectStatusBadge(s){ const map = {'Not Started':'gray','In Progress':'blue','Waiting for Client':'yellow','Revision':'purple','Completed':'green','Delivered':'green','Cancelled':'red'}; return `<span class="badge ${map[s]||'gray'}">${esc(s||'—')}</span>`; }

function row(label, href, value){ return `<div><strong style="color:var(--muted);font-weight:600;display:inline-block;min-width:90px">${esc(label)}</strong>${href?`<a href="${esc(href)}" target="_blank" rel="noopener">${esc(value)}</a>`:esc(value)}</div>`; }
function waLink(number, message){ const n = (number||'').replace(/\D/g,''); return n ? `https://wa.me/${n}${message?'?text='+encodeURIComponent(message):''}` : '#'; }

function openClientForm(id){
  const c = id ? S.clients.find(x=>x.id===id) : {};
  const { close } = openModal(id?'Edit Client':'Add Client', `
    <form id="form-client" class="form-grid">
      <label class="full">Name * <input name="name" required value="${esc(c.name||'')}"></label>
      <label>Mobile * <input name="mobile" required value="${esc(c.mobile||'')}"></label>
      <label>WhatsApp <input name="whatsapp" value="${esc(c.whatsapp||'')}"></label>
      <label>Owner <input name="owner" value="${esc(c.owner||'')}"></label>
      <label>Category <input name="category" value="${esc(c.category||'')}"></label>
      <label class="full">Address <textarea name="address">${esc(c.address||'')}</textarea></label>
      <div class="form-error full" id="err"></div>
      <div class="form-actions full"><button type="button" class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
    </form>`, {wide:true});
  document.getElementById('form-client').onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target); const data = Object.fromEntries(fd.entries());
    const rec = { ...c, id: c.id || uid(), displayId: c.displayId || await nextDisplayId('clients','CL'), createdAt: c.createdAt || new Date().toISOString(), ...data };
    try { await dbPut('clients', rec); await loadAll(); close(); toast('Saved'); route(); } catch(err){ document.getElementById('err').textContent = err.message; document.getElementById('err').style.display='block'; }
  };
}

/* ---------- Helpers: Delete, Backup, Export ---------- */
async function deleteClient(id){ if(!(await confirmAction('Delete client and all data?'))) return; for(const p of S.projects.filter(x=>x.clientId===id)) await dbDel('projects',p.id); for(const p of S.payments.filter(x=>x.clientId===id)) await dbDel('payments',p.id); await dbDel('clients',id); await loadAll(); location.hash='#/clients'; }
async function deleteProject(id){ if(!(await confirmAction('Delete project?'))) return; for(const p of S.payments.filter(x=>x.projectId===id)) await dbDel('payments',p.id); await dbDel('projects',id); await loadAll(); route(); }
async function deletePayment(id){ if(!(await confirmAction('Delete payment?'))) return; await dbDel('payments',id); await loadAll(); route(); }
async function deleteExpense(id){ if(!(await confirmAction('Delete expense?'))) return; await dbDel('expenses',id); await loadAll(); route(); }
async function deleteFollowup(id){ if(!(await confirmAction('Delete follow-up?'))) return; await dbDel('followups',id); await loadAll(); route(); }
async function toggleArchiveClient(id){ const c=S.clients.find(x=>x.id===id); c.archived=!c.archived; await dbPut('clients',c); await loadAll(); route(); }
async function completeFollowup(id){ const f=S.followups.find(x=>x.id===id); f.status='Completed'; await dbPut('followups',f); await loadAll(); route(); }

function openProjectDetail(id){ const p=S.projects.find(x=>x.id===id); if(!p) return; openModal('Project: '+p.name, `<p>Status: ${p.status}</p><p>Agreed: ${fmtMoney(p.agreedPrice)}</p><button class="btn btn-danger" onclick="deleteProject('${p.id}')">Delete</button> <button class="btn btn-primary" onclick="this.closest('.modal-overlay').remove()">Close</button>`); }
function printReceipt(id){ window.print(); }
function printClientStatement(){ window.print(); }

function exportJSON(){ const data={clients:S.clients,projects:S.projects,payments:S.payments,expenses:S.expenses,followups:S.followups}; const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})); a.download='backup.json'; a.click(); }
async function importJSON(ev){ const file=ev.target.files[0]; if(!file) return; const data=JSON.parse(await file.text()); for(const store of ['clients','projects','payments','expenses','followups']) for(const rec of (data[store]||[])) await dbPut(store,rec); await loadAll(); toast('Restored'); route(); }
async function wipeAll(){ if(!(await confirmAction('Wipe all data?'))) return; for(const s of ['clients','projects','payments','expenses','followups']) await dbClear(s); await loadAll(); route(); }

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  try {
    if (!useCloud) await openDB(); 
    buildNav();
    
    if (useCloud) {
      document.getElementById('sync-status').innerHTML = 'Mode: <span style="color:var(--success)">Cloud Sync</span>';
      
      // Initial Load
      await loadAll();
      
      // Real-time sync listener (Updates data automatically when friend adds something)
      supabaseClient.channel('custom-all-channel')
        .on('postgres_changes', { event: '*', schema: 'public' }, (payload) => {
          loadAll().then(() => route());
        }).subscribe();
        
    } else {
      document.getElementById('sync-status').innerHTML = 'Mode: <span style="color:var(--warning)">Local</span>';
      await loadAll();
    }
    
    if(!location.hash) location.hash = '#/dashboard';
    route();
    
  } catch(err){
    document.getElementById('content').innerHTML = `<div class="empty"><h3>Failed to start</h3><p>${esc(err.message)}</p></div>`;
    console.error(err);
  }
})();

window.openFollowupForm = openFollowupForm; window.deleteClient = deleteClient;
window.deleteProject = deleteProject; window.deletePayment = deletePayment;

window.toggleArchiveClient = toggleArchiveClient; window.printReceipt = printReceipt;
window.openInvoice = openProjectDetail; window.printClientStatement = printClientStatement;
window.exportJSON = exportJSON; window.importJSON = importJSON;
window.wipeAll = wipeAll; window.completeFollowup = completeFollowup;
window.openProjectDetail = openProjectDetail;
