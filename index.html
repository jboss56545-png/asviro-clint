<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#070B14">
<title>ASVIRO Client Hub</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#070B14;
  --surface:#101827;
  --surface2:#1A2336;
  --glass:rgba(255,255,255,0.045);
  --glass-strong:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.14);
  --primary:#3685FF;
  --secondary:#00D4FF;
  --text:#F4F7FF;
  --muted:#94A3B8;
  --success:#22C55E;
  --warning:#F59E0B;
  --danger:#EF4444;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 4px 24px rgba(0,0,0,0.35);
  --shadow-lg:0 12px 40px rgba(0,0,0,0.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(circle at 10% 0%, rgba(54,133,255,0.08), transparent 40%),
    radial-gradient(circle at 90% 10%, rgba(0,212,255,0.06), transparent 40%);
  background-attachment:fixed;
  color:var(--text);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:var(--secondary);text-decoration:none;transition:color .2s}
a:hover{color:#fff}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:15px;width:100%;padding:12px 14px;
  background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--radius-sm);
  color:var(--text);outline:none;transition:all .2s;min-height:44px}
input:focus,select:focus,textarea:focus{
  border-color:var(--secondary);
  box-shadow:0 0 0 3px rgba(0,212,255,0.14);
  background:rgba(255,255,255,0.06);
}
input::placeholder,textarea::placeholder{color:#5a6b8a}
select{appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394A3B8' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
  background-repeat:no-repeat;background-position:right 12px center;background-size:16px;padding-right:38px}

/* LAYOUT */
.app{display:flex;min-height:100vh;width:100%}
.sidebar{
  width:250px;position:fixed;top:0;left:0;height:100vh;z-index:100;
  background:linear-gradient(180deg, rgba(16,24,39,0.98), rgba(7,11,20,0.98));
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;
  transition:transform .3s cubic-bezier(0.4,0,0.2,1);
}
.sidebar .brand{padding:22px 20px 18px;font-size:18px;font-weight:800;letter-spacing:-.3px;
  background:linear-gradient(135deg,#60a5fa,var(--secondary));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  border-bottom:1px solid var(--border)}
.sidebar .brand small{display:block;font-size:10px;font-weight:600;color:var(--muted);
  -webkit-text-fill-color:var(--muted);letter-spacing:1.5px;margin-top:2px}
.sidebar nav{flex:1;padding:12px 10px}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);
  color:var(--muted);font-weight:500;margin-bottom:4px;transition:all .2s;font-size:14px}
.sidebar nav a:hover{background:var(--glass);color:var(--text)}
.sidebar nav a.active{background:linear-gradient(90deg,rgba(54,133,255,0.18),rgba(0,212,255,0.05));
  color:var(--text);box-shadow:inset 3px 0 0 var(--secondary);font-weight:600}
.sidebar nav a .icon{width:22px;text-align:center;font-size:17px;flex-shrink:0}
.sidebar .foot{padding:14px 18px;font-size:11px;color:var(--muted);border-top:1px solid var(--border)}

.main{flex:1;margin-left:250px;min-width:0;display:flex;flex-direction:column;width:100%}
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(7,11,20,0.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;padding:12px 20px;
}
.topbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.2px;flex-shrink:0;max-width:200px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .search{flex:1;max-width:420px;position:relative}
.topbar .search input{padding-left:38px;border-radius:99px;min-height:40px;font-size:13px}
.topbar .search::before{content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:13px;opacity:.5;pointer-events:none;z-index:1}
.hamburger{display:none;font-size:22px;padding:6px 10px;border-radius:8px}
.hamburger:active{background:var(--glass)}
.content{padding:20px;flex:1;width:100%}

/* MOBILE BOTTOM NAV */
.bottom-nav{
  display:none;position:fixed;bottom:0;left:0;right:0;z-index:90;
  background:rgba(16,24,39,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
  justify-content:space-around;
}
.bottom-nav a{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  padding:8px 4px;border-radius:10px;color:var(--muted);font-size:10px;font-weight:600;
  text-decoration:none;transition:all .2s;min-height:52px;
}
.bottom-nav a .icon{font-size:20px;line-height:1;margin-bottom:2px}
.bottom-nav a.active{color:var(--secondary);background:var(--glass)}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);
  backdrop-filter:blur(4px);z-index:99;animation:fadeIn .25s}
.overlay.show{display:block}

/* ANIMATIONS */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.animate-enter{animation:slideUp .35s cubic-bezier(0.16,1,0.3,1) forwards}

/* CARDS & GRID */
.grid{display:grid;gap:14px;width:100%}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.card{
  background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;transition:all .25s;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow);width:100%;
}
.card.clickable{cursor:pointer}
.card.clickable:hover{border-color:rgba(0,212,255,0.35);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.stat-value{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.5px;line-height:1.2}
.stat-value.pos{color:var(--success)}
.stat-value.neg{color:var(--danger)}
.stat-value.warn{color:var(--warning)}
.stat-sub{font-size:12px;color:var(--muted);margin-top:4px}
.section-title{font-size:16px;font-weight:700;margin:24px 0 14px;display:flex;align-items:center;gap:10px;letter-spacing:-.2px}
.section-title::before{content:"";display:inline-block;width:3px;height:16px;background:var(--secondary);border-radius:4px;flex-shrink:0}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 16px;border-radius:var(--radius-sm);font-weight:600;font-size:13px;
  transition:all .2s;white-space:nowrap;min-height:40px}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--primary),#2563eb);color:#fff;
  box-shadow:0 4px 12px rgba(54,133,255,0.3)}
.btn-primary:hover{filter:brightness(1.1);box-shadow:0 6px 16px rgba(54,133,255,0.45)}
.btn-ghost{background:var(--glass);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--secondary);background:var(--glass-strong)}
.btn-danger{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.35)}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-success{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.35)}
.btn-sm{padding:6px 11px;font-size:12px;min-height:32px}
.icon-btn{padding:8px;border-radius:8px;font-size:15px;opacity:.75;transition:all .2s;
  min-width:36px;min-height:36px;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{opacity:1;background:var(--glass-strong)}

/* BADGES */
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;
  letter-spacing:.2px;white-space:nowrap;line-height:1.5}
.badge.gray{background:rgba(148,163,184,.15);color:#cbd5e1}
.badge.blue{background:rgba(54,133,255,.18);color:#93c5fd}
.badge.cyan{background:rgba(0,212,255,.15);color:#67e8f9}
.badge.green{background:rgba(34,197,94,.15);color:#86efac}
.badge.yellow{background:rgba(245,158,11,.15);color:#fcd34d}
.badge.red{background:rgba(239,68,68,.15);color:#fca5a5}
.badge.purple{background:rgba(168,85,247,.15);color:#d8b4fe}

/* TABLES */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;
  border:1px solid var(--border);background:var(--glass);width:100%}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  font-weight:700;background:rgba(26,35,54,0.7);position:sticky;top:0;z-index:2}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:rgba(54,133,255,0.06)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* EMPTY STATE */
.empty{text-align:center;padding:48px 20px;color:var(--muted);animation:fadeIn .4s}
.empty .icon{font-size:44px;margin-bottom:12px;opacity:.6}
.empty h3{margin:0 0 6px;color:var(--text);font-size:15px}
.empty p{margin:0 0 16px;font-size:13px;max-width:320px;margin-left:auto;margin-right:auto}

/* FORMS */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid label{display:flex;flex-direction:column;gap:6px;font-size:11px;font-weight:700;
  color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.form-grid label.full{grid-column:1/-1}
.form-grid label input,.form-grid label select,.form-grid label textarea{
  text-transform:none;letter-spacing:0;font-weight:400;color:var(--text);font-size:14px}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;
  padding-top:18px;border-top:1px solid var(--border);flex-wrap:wrap}
.form-error{color:var(--danger);font-size:12px;margin-top:6px;display:none;font-weight:600}
.form-error.show{display:block}
.input-group{display:flex;align-items:center;background:rgba(255,255,255,0.03);
  border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;transition:all .2s;min-height:44px}
.input-group:focus-within{border-color:var(--secondary);box-shadow:0 0 0 3px rgba(0,212,255,0.14)}
.input-group .prefix{padding:0 14px;color:var(--muted);border-right:1px solid var(--border);
  font-weight:600;font-size:14px;background:rgba(0,0,0,0.2);height:100%;display:flex;align-items:center}
.input-group input{border:none!important;border-radius:0!important;background:transparent!important;
  box-shadow:none!important;padding-left:12px!important;min-height:unset!important}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);
  z-index:200;display:flex;align-items:flex-end;justify-content:center;overflow-y:auto;
  animation:fadeIn .2s;padding:0}
.modal{background:var(--surface);border:1px solid var(--border);
  border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;
  animation:slideUp .3s cubic-bezier(0.16,1,0.3,1);box-shadow:0 -10px 40px rgba(0,0,0,0.5)}
.modal.wide{max-width:820px}
.modal-header{display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:rgba(16,24,39,0.98);z-index:2;backdrop-filter:blur(10px)}
.modal-header h2{margin:0;font-size:16px;font-weight:700}
.modal-body{padding:18px 20px 20px}
@media(min-width:640px){
  .modal-overlay{align-items:center;padding:20px}
  .modal{border-radius:20px;box-shadow:var(--shadow-lg)}
}

/* TOASTS */
#toasts{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));right:16px;
  z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{background:rgba(26,35,54,0.98);backdrop-filter:blur(10px);
  border:1px solid var(--border);padding:12px 16px;border-radius:12px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
  animation:slideInRight .3s cubic-bezier(0.16,1,0.3,1);
  color:#fff;display:flex;align-items:center;gap:10px;pointer-events:auto}
.toast.success{border-left:3px solid var(--success)}
.toast.error{border-left:3px solid var(--danger)}
@media(min-width:901px){#toasts{bottom:20px}}

/* FILTERS */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filters input,.filters select{padding:9px 14px;font-size:13px;width:auto;min-width:150px;
  border-radius:99px;min-height:38px}
.filters .search-in{flex:1;min-width:200px}

/* PROGRESS */
.progress{height:6px;background:var(--border);border-radius:99px;overflow:hidden;
  margin-top:8px;box-shadow:inset 0 1px 2px rgba(0,0,0,0.5)}
.progress>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--secondary));
  border-radius:99px;transition:width .5s cubic-bezier(0.4,0,0.2,1)}

/* PROFILE HEADER */
.profile-head{background:linear-gradient(135deg,rgba(16,24,39,0.9),rgba(26,35,54,0.9));
  border:1px solid rgba(0,212,255,0.15);border-radius:var(--radius);padding:20px;
  margin-bottom:16px;backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.profile-head h2{margin:0 0 6px;font-size:20px;letter-spacing:-.4px;line-height:1.3}
.profile-head .meta{color:var(--muted);font-size:12px}

/* CHART */
.chart-box{position:relative;height:260px;padding:6px;width:100%}
.chart-box canvas{max-height:100%;width:100%!important}

/* ACTIVITY TIMELINE */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;
  background:linear-gradient(180deg,var(--primary),var(--secondary),transparent);border-radius:2px}
.timeline-item{position:relative;padding:10px 0 14px 0;border-bottom:1px solid var(--border)}
.timeline-item:last-child{border-bottom:none}
.timeline-item::before{content:"";position:absolute;left:-22px;top:14px;width:10px;height:10px;
  border-radius:50%;background:var(--secondary);box-shadow:0 0 0 3px rgba(0,212,255,0.15)}
.timeline-item .time{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.3px}
.timeline-item .desc{font-size:13px;margin-top:2px;color:var(--text);font-weight:500}

/* UTILITY */
.flex{display:flex}.gap{gap:8px}.gap-lg{gap:14px}.between{justify-content:space-between}
.center{align-items:center}.wrap{flex-wrap:wrap}.column{flex-direction:column}
.mt-1{margin-top:6px}.mt-2{margin-top:14px}.mt-3{margin-top:20px}.mb-2{margin-bottom:14px}
.text-muted{color:var(--muted)}.text-sm{font-size:12px}.text-xs{font-size:11px}
.text-center{text-align:center}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hidden{display:none!important}

/* RESPONSIVE */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);box-shadow:none}
  .sidebar.open{transform:translateX(0);box-shadow:10px 0 50px rgba(0,0,0,0.8)}
  .main{margin-left:0}
  .hamburger{display:flex}
  .bottom-nav{display:flex}
  .content{padding:14px;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .topbar{padding:10px 14px}
  .topbar h1{font-size:15px;max-width:140px}
  .grid.cols-4,.grid.cols-3{grid-template-columns:repeat(2,1fr)}
  .grid.cols-2{grid-template-columns:1fr}
  .topbar .search{display:none}
  .section-title{margin:20px 0 12px}
}
@media(max-width:520px){
  .content{padding:12px;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .grid.cols-4{gap:10px}
  .grid.cols-4 .card{padding:12px 10px;display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;min-height:82px}
  .grid.cols-4 .stat-value{font-size:17px;margin-top:4px}
  .grid.cols-4 .stat-label{font-size:9px;line-height:1.2;letter-spacing:.3px}
  .grid.cols-4 .stat-sub{font-size:10px;margin-top:3px}
  .form-grid{grid-template-columns:1fr}
  .chart-box{height:220px}
  .profile-head{padding:16px}
  .profile-head h2{font-size:18px}
  .modal-body{padding:14px}
  .modal-header{padding:14px 16px}
  .filters input,.filters select{min-width:0;flex:1;font-size:12px}
  .filters .search-in{flex:1 1 100%;min-width:100%}
  .btn{font-size:12px;padding:9px 12px}
  .btn-sm{font-size:11px;padding:6px 9px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">ASVIRO<small>CLIENT HUB</small></div>
    <nav id="nav"></nav>
    <div class="foot">
      <div id="sync-status" style="margin-bottom:4px">Mode: <span style="color:var(--warning)">Connecting…</span></div>
      <div style="opacity:.7">ASVIRO STUDIO</div>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <h1 id="page-title"></h1>
      <div class="search"><input id="global-search" placeholder="Search clients, projects…" autocomplete="off"></div>
      <button class="btn btn-primary" id="quick-add">+ New</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<nav class="bottom-nav" id="bottom-nav"></nav>
<div id="toasts"></div>

<script>
'use strict';

/* ================================================================
   1. CONFIG
   ================================================================ */
const SUPABASE_URL = 'https://vysxnpnxfonafcnylxmu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KD73RIU-GxjcyqnEtR-AiQ_EQxL5PZF';

const APP_VERSION = '2.0.0';
const SCHEMA_VERSION = 2;
const DB_NAME = 'asviro_client_hub';
const DB_VERSION = 2;
const ACTIVITY_LIMIT = 500;

/* ================================================================
   2. UTILITIES
   ================================================================ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => new Date().toISOString().slice(0, 10);
const fmtMoney = n => '₹' + (Number(n) || 0).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtMoneyS = n => '₹' + (Number(n) || 0).toLocaleString('en-IN', {maximumFractionDigits: 0});
const fmtDate = d => { if (!d) return '—'; const dt = new Date(d); return isNaN(dt) ? '—' : dt.toLocaleDateString('en-IN', {day: '2-digit', month: 'short', year: 'numeric'}); };
const fmtDateTime = d => { if (!d) return '—'; const dt = new Date(d); return isNaN(dt) ? '—' : dt.toLocaleString('en-IN', {day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'}); };
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const safeUrl = u => { if (!u) return ''; try { const url = new URL(u.startsWith('http') ? u : 'https://' + u); return ['http:', 'https:'].includes(url.protocol) ? url.href : ''; } catch { return ''; } };
const cleanPhone = p => (p || '').replace(/\D/g, '');
const waLink = (phone, msg) => { const n = cleanPhone(phone); return n ? `https://wa.me/${n}${msg ? '?text=' + encodeURIComponent(msg) : ''}` : '#'; };

function sanitizeRecord(obj, dateFields = [], numFields = [], fkFields = []) {
  const o = { ...obj };
  dateFields.forEach(f => { if (!o[f]) o[f] = null; });
  numFields.forEach(f => { if (o[f] === '' || o[f] == null) o[f] = 0; else o[f] = Number(o[f]); });
  fkFields.forEach(f => { if (!o[f]) o[f] = null; });
  Object.keys(o).forEach(k => { if (o[k] === '') o[k] = null; });
  return o;
}

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<span>${type === 'success' ? '✓' : '⚠'}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(100%)'; t.style.transition = 'all .3s'; setTimeout(() => t.remove(), 300); }, 3000);
}

function confirmAction(msg, danger = true) {
  return new Promise(resolve => {
    const o = document.createElement('div');
    o.className = 'modal-overlay';
    o.innerHTML = `<div class="modal" style="max-width:420px">
      <div class="modal-header"><h2>Confirm Action</h2></div>
      <div class="modal-body">
        <p style="margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.6">${esc(msg)}</p>
        <div class="form-actions" style="border:none;padding:0;margin:0">
          <button class="btn btn-ghost" data-no>Cancel</button>
          <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-yes>Confirm</button>
        </div>
      </div></div>`;
    document.body.appendChild(o);
    o.querySelector('[data-no]').onclick = () => { o.remove(); resolve(false); };
    o.querySelector('[data-yes]').onclick = () => { o.remove(); resolve(true); };
    o.addEventListener('click', e => { if (e.target === o) { o.remove(); resolve(false); } });
  });
}

function openModal(title, bodyHtml, opts = {}) {
  const o = document.createElement('div');
  o.className = 'modal-overlay';
  o.innerHTML = `<div class="modal ${opts.wide ? 'wide' : ''}">
    <div class="modal-header">
      <h2>${esc(title)}</h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button>
    </div>
    <div class="modal-body">${bodyHtml}</div>
  </div>`;
  document.body.appendChild(o);
  const close = () => o.remove();
  o.querySelector('[data-close]').onclick = close;
  o.addEventListener('click', e => { if (e.target === o) close(); });
  return { overlay: o, close, body: o.querySelector('.modal-body') };
}

/* ================================================================
   3. DATABASE LAYER
   ================================================================ */
let supabaseClient = null;
let useCloud = false;
if (SUPABASE_URL && SUPABASE_KEY && window.supabase) {
  try { supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); useCloud = true; }
  catch (e) { console.warn('Supabase init failed, falling back to local', e); }
}

let _db = null;
function openDB() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      ['clients', 'projects', 'payments', 'expenses', 'followups', 'activity', 'meta'].forEach(s => {
        if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' });
      });
    };
    r.onsuccess = e => { _db = e.target.result; resolve(_db); };
    r.onerror = e => reject(e.target.error);
  });
}

function localDB(op, store, arg) {
  return new Promise((resolve, reject) => {
    if (!_db) return reject(new Error('DB not ready'));
    const tx = _db.transaction(store, op === 'get' || op === 'all' ? 'readonly' : 'readwrite');
    const s = tx.objectStore(store);
    let req;
    if (op === 'all') req = s.getAll();
    else if (op === 'get') req = s.get(arg);
    else if (op === 'put') req = s.put(arg);
    else if (op === 'delete') req = s.delete(arg);
    else if (op === 'clear') req = s.clear();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

const dbAll = async store => {
  if (useCloud) {
    const { data, error } = await supabaseClient.from(store).select('*');
    if (error) { console.error('dbAll', store, error); return []; }
    return data || [];
  }
  return (await localDB('all', store)) || [];
};

const dbPut = async (store, obj) => {
  if (useCloud) {
    const { error } = await supabaseClient.from(store).upsert(obj);
    if (error) throw new Error(error.message);
    return obj;
  }
  await localDB('put', store, obj);
  return obj;
};

const dbDel = async (store, id) => {
  if (useCloud) {
    const { error } = await supabaseClient.from(store).delete().eq('id', id);
    if (error) throw new Error(error.message);
    return;
  }
  await localDB('delete', store, id);
};

const dbClear = async store => {
  if (useCloud) {
    const { error } = await supabaseClient.from(store).delete().neq('id', '00000000-0000-0000-0000-000000000000');
    if (error) throw new Error(error.message);
    return;
  }
  await localDB('clear', store);
};

async function logActivity(type, entityType, entityName, description, meta = {}) {
  const rec = {
    id: uid(), type, entityType, entityName: entityName || '',
    description, meta,
    timestamp: new Date().toISOString()
  };
  try {
    await localDB('put', 'activity', rec);
    S.activity.unshift(rec);
    if (S.activity.length > ACTIVITY_LIMIT) S.activity.length = ACTIVITY_LIMIT;
  } catch (e) { console.warn('Activity log failed', e); }
}

const S = { clients: [], projects: [], payments: [], expenses: [], followups: [], activity: [] };

async function loadAll() {
  const stores = ['clients', 'projects', 'payments', 'expenses', 'followups'];
  const results = await Promise.all(stores.map(dbAll));
  stores.forEach((s, i) => S[s] = results[i]);
  try {
    S.activity = (await localDB('all', 'activity') || []).sort((a, b) => b.timestamp.localeCompare(a.timestamp));
  } catch { S.activity = []; }
}

async function nextDisplayId(store, prefix) {
  const all = useCloud ? await dbAll(store) : (await localDB('all', store) || []);
  let max = 0;
  all.forEach(r => { const m = (r.displayId || '').match(/(\d+)$/); if (m) max = Math.max(max, +m[1]); });
  return prefix + '-' + String(max + 1).padStart(4, '0');
}

/* ================================================================
   5. CALCULATIONS
   ================================================================ */
const Calc = {
  projReceived(projectId) {
    return S.payments.filter(p => p.projectId === projectId && p.status === 'Confirmed')
      .reduce((s, p) => s + (p.type === 'Refund' ? -p.amount : p.amount), 0);
  },
  projBalance(project) { return (project.agreedPrice || 0) - Calc.projReceived(project.id); },
  projExpenses(project) {
    const linked = S.expenses.filter(e => e.projectId === project.id).reduce((s, e) => s + (e.amount || 0), 0);
    return (project.domainCost || 0) + (project.hostingCost || 0) + (project.otherExpenses || 0) + linked;
  },
  projNet(project) { return Calc.projReceived(project.id) - Calc.projExpenses(project); },
  projPayStatus(project) {
    const rec = Calc.projReceived(project.id);
    const agreed = project.agreedPrice || 0;
    if (rec <= 0) return 'Unpaid';
    if (rec < agreed) return 'Partially Paid';
    if (rec === agreed) return 'Paid';
    return 'Overpaid';
  },
  clientProjects(clientId) { return S.projects.filter(p => p.clientId === clientId); },
  clientAgreed(clientId) { return Calc.clientProjects(clientId).reduce((s, p) => s + (p.agreedPrice || 0), 0); },
  clientReceived(clientId) {
    return S.payments.filter(p => p.clientId === clientId && p.status === 'Confirmed')
      .reduce((s, p) => s + (p.type === 'Refund' ? -p.amount : p.amount), 0);
  },
  clientExpenses(clientId) {
    const direct = S.expenses.filter(e => e.clientId === clientId).reduce((s, e) => s + (e.amount || 0), 0);
    const proj = Calc.clientProjects(clientId).reduce((s, p) => s + (p.domainCost || 0) + (p.hostingCost || 0) + (p.otherExpenses || 0), 0);
    return direct + proj;
  },
  clientOutstanding(clientId) { return Calc.clientAgreed(clientId) - Calc.clientReceived(clientId); },
  totalAgreed() { return S.projects.filter(p => p.status !== 'Cancelled').reduce((s, p) => s + (p.agreedPrice || 0), 0); },
  totalReceived() { return S.payments.filter(p => p.status === 'Confirmed').reduce((s, p) => s + (p.type === 'Refund' ? -p.amount : p.amount), 0); },
  totalPending() { return S.projects.reduce((s, p) => { const b = Calc.projBalance(p); return s + (b > 0 ? b : 0); }, 0); },
  totalExpenses() {
    const e = S.expenses.reduce((s, x) => s + (x.amount || 0), 0);
    const p = S.projects.reduce((s, x) => s + (x.domainCost || 0) + (x.hostingCost || 0) + (x.otherExpenses || 0), 0);
    return e + p;
  },
  netCash() { return Calc.totalReceived() - Calc.totalExpenses(); },
  overdueAmount() {
    const today = todayStr();
    return S.projects.reduce((s, p) => { const b = Calc.projBalance(p); return s + (b > 0 && p.deadline && p.deadline < today ? b : 0); }, 0);
  },
  activeProjects() { return S.projects.filter(p => ['Planning', 'In Progress', 'Review', 'Not Started', 'Waiting for Client', 'Revision'].includes(p.status)); },
  completedProjects() { return S.projects.filter(p => ['Completed', 'Delivered'].includes(p.status)); },
  upcomingDeadlines(days = 14) {
    const today = todayStr();
    const until = addDays(today, days);
    return S.projects.filter(p => p.deadline && p.deadline >= today && p.deadline <= until &&
      !['Completed', 'Delivered', 'Cancelled'].includes(p.status))
      .sort((a, b) => a.deadline.localeCompare(b.deadline));
  },
  followupsDueToday() {
    const today = todayStr();
    return S.followups.filter(f => f.status === 'Pending' && f.date <= today);
  }
};
function addDays(dateStr, n) { const d = new Date(dateStr); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

let chartInstances = {};
function destroyCharts() { Object.values(chartInstances).forEach(c => c && c.destroy()); chartInstances = {}; }
function makeChart(id, config) {
  const el = document.getElementById(id);

  Chart.defaults.borderColor = 'rgba(255,255,255,0.06)';
  Chart.defaults.font.family = "-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif";
}
function emptyChart(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.parentElement.innerHTML = `<div class="empty" style="padding:40px 16px"><div class="icon">📊</div><p>${esc(msg)}</p></div>`;
}
function last6Months() {
  const arr = []; const d = new Date();
  for (let i = 5; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); arr.push(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0')); }
  return arr;
}

function route() {
  const hash = location.hash.slice(1) || '/dashboard';
  const [path] = hash.split('?');
  const parts = path.split('/').filter(Boolean);
  const name = parts[0] || 'dashboard';
  const fn = routes[name] || renderDashboard;
  destroyCharts();

  try { fn(parts.slice(1)); } catch (e) { console.error(e); $('#content').innerHTML = `<div class="empty"><h3>Error loading page</h3><p>${esc(e.message)}</p></div>`; }

  const content = $('#content');
  content.classList.remove('animate-enter');
  void content.offsetWidth;
  content.classList.add('animate-enter');

  $$('.sidebar nav a, .bottom-nav a').forEach(a => a.classList.toggle('active', a.dataset.route === name));
  $('#sidebar').classList.remove('open');
  $('#overlay').classList.remove('show');
  window.scrollTo(0, 0);
}

      type: 'bar',

      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { callback: v => fmtMoneyS(v), font: { size: 10 } } }, x: { grid: { display: false }, ticks: { font: { size: 10 } } } } }
    });
  } else emptyChart('chart-revenue', 'No payments recorded yet');

  const statusCounts = {};
  S.projects.forEach(p => { statusCounts[p.status || 'Planning'] = (statusCounts[p.status || 'Planning'] || 0) + 1; });
  if (Object.keys(statusCounts).length) {
    makeChart('chart-status', {
      type: 'doughnut',
      data: { labels: Object.keys(statusCounts), datasets: [{ data: Object.values(statusCounts), backgroundColor: ['#3685FF', '#00D4FF', '#F59E0B', '#A855F7', '#22C55E', '#EF4444', '#64748B'], borderWidth: 0 }] },
      options: { cutout: '70%', responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, padding: 14, font: { size: 11 } } } } }
    });
  } else emptyChart('chart-status', 'No projects yet');
}

function statCard(label, value, sub, cls = '') {
  return `<div class="card"><div class="stat-label">${esc(label)}</div><div class="stat-value ${cls}">${esc(String(value))}</div>${sub ? `<div class="stat-sub">${esc(sub)}</div>` : ''}</div>`;
}

/* ================================================================
   9. CLIENTS
   ================================================================ */
function renderClients(parts) {
  $('#page-title').textContent = 'Clients';
  const params = new URLSearchParams((location.hash.split('?')[1]) || '');
  const initialQ = params.get('q') || '';
  const initialCat = params.get('cat') || '';
  const initialSort = params.get('sort') || 'newest';
  const categories = [...new Set(S.clients.map(c => c.category).filter(Boolean))];

  $('#content').innerHTML = `
    <div class="filters">
      <input id="f-q" class="search-in" placeholder="Search name, owner, mobile, project…" value="${esc(initialQ)}">
      <select id="f-cat"><option value="">All Categories</option>${categories.map(c => `<option ${initialCat === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <select id="f-sort">
        <option value="newest" ${initialSort === 'newest' ? 'selected' : ''}>Newest First</option>
        <option value="oldest" ${initialSort === 'oldest' ? 'selected' : ''}>Oldest First</option>
        <option value="name" ${initialSort === 'name' ? 'selected' : ''}>Name A–Z</option>
        <option value="outstanding" ${initialSort === 'outstanding' ? 'selected' : ''}>Highest Outstanding</option>
      </select>
      <button class="btn btn-primary" style="margin-left:auto" onclick="openClientForm()">+ Client</button>
    </div>
    <div id="clients-list"></div>
  `;

  const renderList = () => {
    const q = ($('#f-q').value || '').trim().toLowerCase();
    const cat = $('#f-cat').value;
    const sort = $('#f-sort').value;
    let list = S.clients.filter(c => !c.archived);

    if (q) {
      list = list.filter(c =>
        (c.name || '').toLowerCase().includes(q) ||
        (c.owner || '').toLowerCase().includes(q) ||
        (c.mobile || '').includes(q) ||
        (c.displayId || '').toLowerCase().includes(q) ||
        S.projects.some(p => p.clientId === c.id && (p.name || '').toLowerCase().includes(q))
      );
    }
    if (cat) list = list.filter(c => c.category === cat);
    list.sort((a, b) => {
      if (sort === 'newest') return (b.createdAt || '').localeCompare(a.createdAt || '');
      if (sort === 'oldest') return (a.createdAt || '').localeCompare(b.createdAt || '');
      if (sort === 'name') return (a.name || '').localeCompare(b.name || '');
      if (sort === 'outstanding') return Calc.clientOutstanding(b.id) - Calc.clientOutstanding(a.id);
      return 0;
    });

    const container = $('#clients-list');
    if (list.length) {
      container.innerHTML = `
        <div class="table-wrap"><table>
          <thead><tr><th>ID</th><th>Client</th><th>Mobile</th><th>Projects</th><th class="num">Outstanding</th></tr></thead>
          <tbody>${list.map(c => {
            const out = Calc.clientOutstanding(c.id);
            const pc = Calc.clientProjects(c.id).length;
            return `<tr onclick="location.hash='#/client/${c.id}'">
              <td><span class="badge gray">${esc(c.displayId || '—')}</span></td>
              <td><strong style="font-size:13px;color:#fff">${esc(c.name)}</strong>${c.owner ? `<div class="stat-sub">${esc(c.owner)}</div>` : ''}</td>
              <td>${esc(c.mobile || '—')}</td>
              <td><span class="badge blue">${pc}</span></td>
              <td class="num" style="color:${out > 0 ? 'var(--warning)' : 'var(--success)'};font-weight:600">${fmtMoney(out)}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
      `;
    } else {
      container.innerHTML = `<div class="empty"><div class="icon">👥</div><h3>No clients found</h3><p>Add your first client to get started.</p><button class="btn btn-primary" onclick="openClientForm()">+ Add Client</button></div>`;
    }
  };

  $('#f-q').addEventListener('input', debounce(renderList, 250));
  $('#f-cat').addEventListener('change', renderList);
  $('#f-sort').addEventListener('change', renderList);
  renderList();
}

   ================================================================ */
function renderClientProfile(parts) {
  const id = parts[0];

  const payments = S.payments.filter(p => p.clientId === c.id).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const followups = S.followups.filter(f => f.clientId === c.id).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  $('#content').innerHTML = `
    <div class="profile-head animate-enter">
      <div class="flex between center wrap gap">
        <div style="min-width:0;flex:1">
          <h2>${esc(c.name)} <span class="badge cyan">${esc(c.displayId || '')}</span></h2>
          <div class="meta">${esc(c.owner || '—')} · ${esc(c.category || '—')} · ${esc(c.mobile || '—')}</div>
        </div>
        <div class="flex gap wrap">
          ${c.whatsapp ? `<a class="btn btn-success btn-sm" href="${waLink(c.whatsapp, '')}" target="_blank" rel="noopener">💬 WhatsApp</a>` : ''}
          <button class="btn btn-ghost btn-sm" onclick="openClientForm('${c.id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="deleteClient('${c.id}')">Delete</button>
        </div>
      </div>
      <div class="grid cols-4 mt-2">
        ${statCard('Agreed', fmtMoneyS(agreed), 'Total')}
        ${statCard('Received', fmtMoneyS(received), '', 'pos')}
        ${statCard('Outstanding', fmtMoneyS(out), '', out > 0 ? 'warn' : 'pos')}
        ${statCard('Projects', projects.length, '')}
      </div>
      <div class="progress"><div style="width:${pct}%"></div></div>
      <div class="stat-sub mt-1">${pct.toFixed(0)}% received</div>
    </div>

    <div class="card mb-2">
      <div class="stat-label">Contact Information</div>
      <div class="mt-2" style="font-size:13px;line-height:2">
        ${row('Mobile', null, c.mobile || '—')}
        ${c.whatsapp ? row('WhatsApp', waLink(c.whatsapp, ''), c.whatsapp) : ''}
        ${c.mapsUrl ? row('Maps', c.mapsUrl, 'Open Location') : ''}
        ${c.websiteUrl ? row('Website', c.websiteUrl, c.websiteUrl) : ''}
        ${c.address ? row('Address', null, c.address) : ''}
        ${c.source ? row('Source', null, c.source) : ''}
      </div>
      ${c.notes ? `<div class="mt-2"><div class="stat-label">Notes</div><div class="mt-1" style="font-size:13px;white-space:pre-wrap;background:rgba(0,0,0,0.2);padding:10px;border-radius:8px">${esc(c.notes)}</div></div>` : ''}
    </div>

    <h3 class="section-title">Projects <button class="btn btn-sm btn-primary" style="margin-left:8px" onclick="openProjectForm(null,'${c.id}')">+ Add Project</button></h3>
    ${projects.length ? projects.map(p => {
      const rec = Calc.projReceived(p.id);
      const bal = Calc.projBalance(p);
      const st = Calc.projPayStatus(p);
      return `<div class="card clickable mb-2" onclick="openProjectDetail('${p.id}')">
        <div class="flex between center wrap gap">
          <div style="min-width:0;flex:1">
            <strong style="font-size:14px;color:#fff">${esc(p.name)}</strong>
            <span class="badge gray">${esc(p.displayId || '')}</span>
            ${projectStatusBadge(p.status)}
          </div>
          <div class="flex gap center">${payStatusBadge(st)}<strong style="font-size:14px;color:${bal > 0 ? 'var(--warning)' : 'var(--success)'}">${fmtMoney(bal)}</strong></div>
        </div>
        <div class="stat-sub mt-1">Agreed ${fmtMoney(p.agreedPrice)} · Received ${fmtMoney(rec)} · Deadline ${fmtDate(p.deadline)}</div>
      </div>`;
    }).join('') : `<div class="card empty"><p>No projects yet</p></div>`}

    <h3 class="section-title">Payment History (${payments.length})</h3>
    ${payments.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Receipt</th><th>Date</th><th>Project</th><th class="num">Amount</th><th>Method</th><th>Status</th><th></th></tr></thead>
      <tbody>${payments.map(p => {
        const proj = S.projects.find(x => x.id === p.projectId);
        return `<tr>
          <td>${esc(p.displayId || '—')}</td>
          <td>${fmtDate(p.date)}</td>
          <td>${esc(proj ? proj.name : '—')}</td>
          <td class="num" style="color:${p.type === 'Refund' ? 'var(--danger)' : 'var(--success)'};font-weight:600">${p.type === 'Refund' ? '-' : ''}${fmtMoney(p.amount)}</td>
          <td>${esc(p.method || '—')}</td>
          <td><span class="badge ${p.status === 'Confirmed' ? 'green' : 'yellow'}">${esc(p.status)}</span></td>
          <td style="white-space:nowrap;text-align:right">
            <button class="icon-btn" onclick="event.stopPropagation();openPaymentForm('${p.id}')" title="Edit">✏️</button>
            <button class="icon-btn" onclick="event.stopPropagation();deletePayment('${p.id}')" title="Delete">🗑️</button>
          </td>
        </tr>`;

    <h3 class="section-title">Follow-ups</h3>
    ${followups.length ? followups.map(f => `
      <div class="card mb-2">
        <div class="flex between center wrap gap">
          <div style="min-width:0;flex:1"><strong>${esc(f.purpose)}</strong><div class="stat-sub">${fmtDate(f.date)}</div></div>
          <span class="badge ${f.status === 'Completed' ? 'green' : f.status === 'Rescheduled' ? 'yellow' : (f.date < todayStr() ? 'red' : 'blue')}">${esc(f.status)}</span>
        </div>
        ${f.notes ? `<div class="stat-sub mt-1">${esc(f.notes)}</div>` : ''}
      </div>`).join('') : `<div class="card empty"><p>No follow-ups</p><button class="btn btn-primary btn-sm" onclick="openFollowupForm(null,'${c.id}')">+ Add Follow-up</button></div>`}
  `;
}

function row(label, href, value) {
  return `<div><strong style="color:var(--muted);font-weight:600;display:inline-block;min-width:90px">${esc(label)}</strong>${href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(value)}</a>` : esc(value)}</div>`;
}

function clientStatusBadge(s) { const map = { Lead: 'gray', Contacted: 'blue', Interested: 'cyan', Confirmed: 'purple', Active: 'green', Completed: 'green', Cancelled: 'red' }; return `<span class="badge ${map[s] || 'gray'}">${esc(s || '—')}</span>`; }
function projectStatusBadge(s) { const map = { 'Planning': 'gray', 'Not Started': 'gray', 'In Progress': 'blue', 'Review': 'purple', 'Revision': 'purple', 'Waiting for Client': 'yellow', 'On Hold': 'yellow', 'Completed': 'green', 'Delivered': 'green', 'Cancelled': 'red' }; return `<span class="badge ${map[s] || 'gray'}">${esc(s || '—')}</span>`; }
function payStatusBadge(s) { const map = { Unpaid: 'red', 'Partially Paid': 'yellow', Paid: 'green', Overpaid: 'cyan' }; return `<span class="badge ${map[s] || 'gray'}">${esc(s)}</span>`; }

/* ================================================================
   11. PROJECTS
   ================================================================ */
function renderProjects() {
  $('#page-title').textContent = 'Projects';
  const statuses = ['Planning', 'In Progress', 'Review', 'Completed', 'On Hold', 'Cancelled'];

  $('#content').innerHTML = `
    <div class="filters">
      <input id="p-q" class="search-in" placeholder="Search project or client…">
      <select id="p-status"><option value="">All Statuses</option>${statuses.map(s => `<option>${s}</option>`).join('')}</select>
      <select id="p-sort"><option value="newest">Newest First</option><option value="deadline">Nearest Deadline</option><option value="balance">Highest Balance</option></select>
      <button class="btn btn-primary" style="margin-left:auto" onclick="openProjectForm()">+ Project</button>
    </div>
    <div id="projects-list"></div>
  `;

  const renderList = () => {
    const q = ($('#p-q').value || '').trim().toLowerCase();
    const st = $('#p-status').value;
    const sort = $('#p-sort').value;
    let list = S.projects.slice();
    if (q) list = list.filter(p => (p.name || '').toLowerCase().includes(q) || (p.displayId || '').toLowerCase().includes(q) || (S.clients.find(c => c.id === p.clientId)?.name || '').toLowerCase().includes(q));
    if (st) list = list.filter(p => p.status === st);
    list.sort((a, b) => {
      if (sort === 'deadline') { if (!a.deadline) return 1; if (!b.deadline) return -1; return a.deadline.localeCompare(b.deadline); }
      if (sort === 'balance') return Calc.projBalance(b) - Calc.projBalance(a);
      return (b.createdAt || '').localeCompare(a.createdAt || '');
    });

    const container = $('#projects-list');
    if (list.length) {
      container.innerHTML = `<div class="table-wrap"><table>
        <thead><tr><th>ID</th><th>Project</th><th>Client</th><th>Status</th><th class="num">Balance</th><th>Deadline</th></tr></thead>
        <tbody>${list.map(p => {
          const c = S.clients.find(x => x.id === p.clientId);
          const bal = Calc.projBalance(p);
          const overdue = p.deadline && p.deadline < todayStr() && bal > 0 && !['Completed', 'Delivered', 'Cancelled'].includes(p.status);
          return `<tr onclick="openProjectDetail('${p.id}')">
            <td><span class="badge gray">${esc(p.displayId || '—')}</span></td>
            <td><strong style="font-size:13px;color:#fff">${esc(p.name)}</strong>${overdue ? '<div class="badge red mt-1">Overdue</div>' : ''}</td>
            <td>${esc(c ? c.name : '—')}</td>
            <td>${projectStatusBadge(p.status)}</td>
            <td class="num" style="color:${bal > 0 ? 'var(--warning)' : 'var(--success)'};font-weight:600">${fmtMoney(bal)}</td>
            <td>${fmtDate(p.deadline)}</td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`;
    } else {
      container.innerHTML = `<div class="empty"><div class="icon">🗂️</div><h3>No projects found</h3><button class="btn btn-primary" onclick="openProjectForm()">+ Add Project</button></div>`;
    }
  };

  $('#p-q').addEventListener('input', debounce(renderList, 250));
  $('#p-status').addEventListener('change', renderList);
  $('#p-sort').addEventListener('change', renderList);
  renderList();
}

function openProjectDetail(id) {
  const p = S.projects.find(x => x.id === id);
  if (!p) return;
  const rec = Calc.projReceived(p.id);
  const bal = Calc.projBalance(p);
  const exp = Calc.projExpenses(p);
  const net = Calc.projNet(p);
  const st = Calc.projPayStatus(p);
  const payments = S.payments.filter(x => x.projectId === p.id).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const client = S.clients.find(c => c.id === p.clientId);

  openModal('Project Details', `
    <div style="margin-bottom:14px">
      <strong style="font-size:16px;color:#fff">${esc(p.name)}</strong>
      <span class="badge gray">${esc(p.displayId || '')}</span>
      ${projectStatusBadge(p.status)}
      ${payStatusBadge(st)}
    </div>
    <div class="grid cols-2" style="margin-bottom:14px">
      ${statCard('Agreed', fmtMoney(p.agreedPrice))}
      ${statCard('Received', fmtMoney(rec), '', 'pos')}
      ${statCard('Balance', fmtMoney(bal), '', bal > 0 ? 'warn' : 'pos')}
      ${statCard('Expenses', fmtMoney(exp))}
    </div>
    <div class="card" style="background:rgba(0,0,0,0.2)">
      <div class="stat-sub">Client: <strong style="color:var(--text)">${esc(client ? client.name : '—')}</strong></div>
      ${p.type ? `<div class="stat-sub">Category: ${esc(p.type)}</div>` : ''}
      <div class="stat-sub">Deadline: ${fmtDate(p.deadline)}${p.deliveryDate ? ` · Delivered: ${fmtDate(p.deliveryDate)}` : ''}</div>
      ${p.liveUrl ? `<div class="stat-sub mt-1">Live: <a href="${esc(safeUrl(p.liveUrl) || p.liveUrl)}" target="_blank" rel="noopener">${esc(p.liveUrl)}</a></div>` : ''}
      ${p.notes ? `<div class="stat-sub mt-2"><strong>Notes:</strong> ${esc(p.notes)}</div>` : ''}
      <div class="stat-sub mt-2">Net earnings: <strong style="color:${net >= 0 ? 'var(--success)' : 'var(--danger)'}">${fmtMoney(net)}</strong></div>
    </div>
    <h3 class="section-title" style="margin-top:16px">Payments (${payments.length})</h3>
    <div style="max-height:220px;overflow-y:auto">
      ${payments.length ? payments.map(x => `
        <div class="flex between center" style="padding:10px 0;border-bottom:1px solid var(--border);font-size:13px">
          <div><strong>${fmtDate(x.date)}</strong> · <span class="badge gray">${esc(x.displayId || '')}</span> · ${esc(x.method || '')}</div>
          <div><span style="font-weight:600;color:${x.type === 'Refund' ? 'var(--danger)' : 'var(--success)'}">${x.type === 'Refund' ? '-' : ''}${fmtMoney(x.amount)}</span></div>
        </div>`).join('') : `<div class="empty" style="padding:20px"><p>No payments yet</p></div>`}
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove();openPaymentForm(null,null,'${p.id}')">+ Payment</button>
      <button class="btn btn-primary" onclick="this.closest('.modal-overlay').remove();openProjectForm('${p.id}')">Edit</button>
      <button class="btn btn-danger" onclick="this.closest('.modal-overlay').remove();deleteProject('${p.id}')">Delete</button>
    </div>
  `, { wide: true });
}

/* ================================================================
   14. FOLLOW-UPS

function csvEscape(v) {
  const s = v == null ? '' : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(headers, rows) {
  return '\uFEFF' + [headers.map(csvEscape).join(','), ...rows.map(r => r.map(csvEscape).join(','))].join('\r\n');
}
function downloadFile(filename, content, mime = 'text/csv;charset=utf-8;') {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportCSV(type) {
  try {
    if (type === 'clients') {
      const headers = ['Client ID', 'Business Name', 'Owner', 'Category', 'Mobile', 'WhatsApp', 'Maps URL', 'Website', 'Source', 'Address', 'Notes', 'Created'];
      const rows = S.clients.map(c => [c.displayId || '', c.name || '', c.owner || '', c.category || '', c.mobile || '', c.whatsapp || '', c.mapsUrl || '', c.websiteUrl || '', c.source || '', c.address || '', c.notes || '', fmtDate(c.createdAt)]);
      downloadFile('Clients.csv', toCSV(headers, rows));
    } else if (type === 'projects') {
      const headers = ['Project ID', 'Project Name', 'Client', 'Category', 'Status', 'Agreed Price', 'Received', 'Balance', 'Deadline', 'Delivery Date', 'Live URL', 'Notes', 'Created'];
      const rows = S.projects.map(p => {
        const c = S.clients.find(x => x.id === p.clientId);
        return [p.displayId || '', p.name || '', c ? c.name : '', p.type || '', p.status || '', p.agreedPrice || 0, Calc.projReceived(p.id), Calc.projBalance(p), fmtDate(p.deadline), fmtDate(p.deliveryDate), p.liveUrl || '', p.notes || '', fmtDate(p.createdAt)];
      });
      downloadFile('Projects.csv', toCSV(headers, rows));
    } else if (type === 'payments') {
      const headers = ['Receipt', 'Date', 'Client', 'Project', 'Type', 'Amount', 'Method', 'Purpose', 'Reference', 'Status', 'Notes'];
      const rows = S.payments.map(p => {
        const c = S.clients.find(x => x.id === p.clientId);
        const pr = S.projects.find(x => x.id === p.projectId);
        return [p.displayId || '', fmtDate(p.date), c ? c.name : '', pr ? pr.name : '', p.type || 'Payment', p.amount || 0, p.method || '', p.purpose || '', p.refId || '', p.status || '', p.notes || ''];
      });
      downloadFile('Payments.csv', toCSV(headers, rows));
    } else if (type === 'report') {
      const headers = ['Client', 'Owner', 'Mobile', 'Projects', 'Total Agreed', 'Total Received', 'Outstanding'];
      const rows = S.clients.map(c => [c.name, c.owner || '', c.mobile || '', Calc.clientProjects(c.id).length, Calc.clientAgreed(c.id), Calc.clientReceived(c.id), Calc.clientOutstanding(c.id)]);
      downloadFile('Business-Report.csv', toCSV(headers, rows));
    }
    toast('CSV exported');
  } catch (e) { toast('Export failed: ' + e.message, 'error'); }
}

      await loadAll(); close(); toast(id ? 'Project updated' : 'Project created'); route();
    } catch (err) {
      errEl.textContent = 'Error: ' + err.message; errEl.classList.add('show');
      btn.disabled = false; btn.textContent = id ? 'Save Changes' : 'Create Project';
    }
  };

  const updateProj = (cid, sel = '') => {
    const plist = S.projects.filter(x => x.clientId === cid);
    document.getElementById('pay-proj').innerHTML = plist.length
      ? plist.map(x => `<option value="${x.id}" ${x.id === sel ? 'selected' : ''}>${esc(x.name)}</option>`).join('')
      : '<option value="">⚠ No projects for this client.</option>';
  };
  document.getElementById('pay-client').onchange = e => updateProj(e.target.value);
  updateProj(defaultClientId, p.projectId);

  document.getElementById('form-pay').onsubmit = async e => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; btn.textContent = 'Saving…';
    const data = Object.fromEntries(new FormData(e.target).entries());
    const errEl = document.getElementById('pay-err');
    errEl.classList.remove('show');

    const amount = parseFloat(data.amount);
    if (isNaN(amount) || amount <= 0) {
      errEl.textContent = 'Amount must be greater than zero.'; errEl.classList.add('show');
      btn.disabled = false; btn.textContent = id ? 'Save Changes' : 'Record Payment'; return;
    }
    if (!data.projectId) {
      errEl.textContent = 'Please select a project.'; errEl.classList.add('show');
      btn.disabled = false; btn.textContent = id ? 'Save Changes' : 'Record Payment'; return;
    }

    // Overpayment warning
    if (data.type === 'Payment' && !id) {
      const proj = S.projects.find(x => x.id === data.projectId);
      if (proj) {
        const remaining = Calc.projBalance(proj);
        if (amount > remaining + 0.01) {
          if (!confirm(`Payment ${fmtMoney(amount)} exceeds remaining balance ${fmtMoney(remaining)}. Continue?`)) {
            btn.disabled = false; btn.textContent = 'Record Payment'; return;
          }
        }
      }
    }

    // Duplicate warning
    if (!id) {
      const dup = S.payments.find(x => x.projectId === data.projectId && Number(x.amount) === amount && x.date === data.date && x.status === data.status);
      if (dup) {
        if (!confirm(`A similar payment already exists (${dup.displayId}). Continue anyway?`)) {
          btn.disabled = false; btn.textContent = 'Record Payment'; return;
        }
      }
    }

    let rec = {
      ...p,
      id: p.id || uid(),
      displayId: p.displayId || await nextDisplayId('payments', 'RC'),
      createdAt: p.createdAt || new Date().toISOString(),
      clientId: data.clientId,
      projectId: data.projectId,
      type: data.type,
      amount,
      date: data.date,
      method: data.method,
      purpose: data.purpose,
      refId: data.refId || null,
      notes: data.notes || null,
      status: data.status
    };
    rec = sanitizeRecord(rec, ['date'], ['amount'], ['clientId', 'projectId']);

    try {
      await dbPut('payments', rec);
      await logActivity(id ? 'payment_updated' : 'payment_received', 'payment', rec.displayId,
        id ? `Payment ${fmtMoney(rec.amount)} updated` : `Payment ${fmtMoney(rec.amount)} received`,
        { paymentId: rec.id, projectId: rec.projectId, amount: rec.amount });
      await loadAll(); close(); toast(id ? 'Payment updated' : 'Payment recorded'); route();
    } catch (err) {
      errEl.textContent = 'Error: ' + err.message; errEl.classList.add('show');
      btn.disabled = false; btn.textContent = id ? 'Save Changes' : 'Record Payment';
    }
  };
}

/* ================================================================
   24. DELETE + BACKUP HELPERS
   ================================================================ */
async function deleteClient(id) {
  const c = S.clients.find(x => x.id === id);
  if (!c) return;
  if (!(await confirmAction(`Delete client "${c.name}" and all related projects, payments and follow-ups? This cannot be undone.`))) return;
  try {
    for (const p of S.projects.filter(x => x.clientId === id)) {
      for (const pay of S.payments.filter(x => x.projectId === p.id)) await dbDel('payments', pay.id);
      await dbDel('projects', p.id);
    }
    for (const pay of S.payments.filter(x => x.clientId === id)) await dbDel('payments', pay.id);
    for (const f of S.followups.filter(x => x.clientId === id)) await dbDel('followups', f.id);
    await dbDel('clients', id);
    await logActivity('client_deleted', 'client', c.name, `Client "${c.name}" deleted`);
    await loadAll(); location.hash = '#/clients'; toast('Client deleted');
  } catch (e) { toast('Delete failed: ' + e.message, 'error'); }
}

async function deleteProject(id) {
  const p = S.projects.find(x => x.id === id);
  if (!p) return;
  if (!(await confirmAction(`Delete project "${p.name}" and its payment records?`))) return;
  try {
    for (const pay of S.payments.filter(x => x.projectId === id)) await dbDel('payments', pay.id);
    await dbDel('projects', id);
    await logActivity('project_deleted', 'project', p.name, `Project "${p.name}" deleted`);
    await loadAll(); route(); toast('Project deleted');
  } catch (e) { toast('Delete failed: ' + e.message, 'error'); }
}

async function deletePayment(id) {
  const p = S.payments.find(x => x.id === id);
  if (!p) return;
  if (!(await confirmAction(`Delete payment ${p.displayId || ''} of ${fmtMoney(p.amount)}? Totals will be recalculated.`))) return;
  try {
    await dbDel('payments', id);
    await logActivity('payment_deleted', 'payment', p.displayId || '', `Payment ${fmtMoney(p.amount)} deleted`);
    await loadAll(); route(); toast('Payment deleted');
  } catch (e) { toast('Delete failed: ' + e.message, 'error'); }
}

async function deleteExpense(id) {
  if (!(await confirmAction('Delete this expense?'))) return;
  try { await dbDel('expenses', id); await loadAll(); route(); toast('Expense deleted'); }
  catch (e) { toast('Delete failed: ' + e.message, 'error'); }
}

async function deleteFollowup(id) {
  if (!(await confirmAction('Delete this follow-up?'))) return;
  try { await dbDel('followups', id); await loadAll(); route(); toast('Follow-up deleted'); }
  catch (e) { toast('Delete failed: ' + e.message, 'error'); }
}

async function completeFollowup(id) {
  const f = S.followups.find(x => x.id === id);
  if (!f) return;
  f.status = 'Completed';
  try {
    await dbPut('followups', f);
    await logActivity('followup_completed', 'followup', f.purpose, `Follow-up completed: ${f.purpose}`);
    await loadAll(); route(); toast('Follow-up completed');
  } catch (e) { toast('Failed: ' + e.message, 'error'); }
}

function printReceipt(id) {
  const p = S.payments.find(x => x.id === id);
  if (!p) return;
  const c = S.clients.find(x => x.id === p.clientId);
  const pr = S.projects.find(x => x.id === p.projectId);
  const w = window.open('', '_blank');
  if (!w) return toast('Please allow popups to print', 'error');
  
  // Escaped closing script tag to avoid breaking the main HTML parser
  w.document.write(`<!DOCTYPE html><html><head><title>Receipt ${esc(p.displayId)}</title>
    <style>body{font-family:system-ui,sans-serif;padding:30px;max-width:600px;margin:0 auto;color:#111}
    h1{font-size:22px;margin:0 0 4px} .muted{color:#666;font-size:13px}
    table{width:100%;margin-top:20px;border-collapse:collapse}
    td{padding:10px 0;border-bottom:1px solid #eee;font-size:14px}
    td:last-child{text-align:right;font-weight:600}
    .total{font-size:20px;font-weight:700;margin-top:20px;text-align:right}
    @media print{body{padding:0}}</style></head><body>
    <h1>ASVIRO STUDIO</h1>
    <div class="muted">Payment Receipt</div>
    <table>
      <tr><td>Receipt No.</td><td>${esc(p.displayId || '—')}</td></tr>
      <tr><td>Date</td><td>${fmtDate(p.date)}</td></tr>
      <tr><td>Client</td><td>${esc(c ? c.name : '—')}</td></tr>
      <tr><td>Project</td><td>${esc(pr ? pr.name : '—')}</td></tr>
      <tr><td>Method</td><td>${esc(p.method || '—')}</td></tr>
      <tr><td>Purpose</td><td>${esc(p.purpose || '—')}</td></tr>
      <tr><td>Status</td><td>${esc(p.status || '—')}</td></tr>
      ${p.refId ? `<tr><td>Reference</td><td>${esc(p.refId)}</td></tr>` : ''}
      ${p.notes ? `<tr><td>Notes</td><td>${esc(p.notes)}</td></tr>` : ''}
    </table>
    <div class="total">Amount: ${p.type === 'Refund' ? '-' : ''}${fmtMoney(p.amount)}</div>
    <div style="margin-top:40px;text-align:center;color:#666;font-size:12px">Thank you for your business</div>
    <scr` + `ipt>setTimeout(()=>window.print(),250)</scr` + `ipt></body></html>`);
  w.document.close();
}

function exportJSON() {
  const data = {
    version: APP_VERSION, schemaVersion: SCHEMA_VERSION, exportedAt: new Date().toISOString(),
    clients: S.clients, projects: S.projects, payments: S.payments, expenses: S.expenses, followups: S.followups
  };
  downloadFile('asviro-backup-' + todayStr() + '.json', JSON.stringify(data, null, 2), 'application/json');
  toast('Backup downloaded');
}

async function importJSON(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.clients || !data.projects) throw new Error('Invalid backup file structure');
    if (!(await confirmAction(`This will REPLACE all current data with the backup (${data.clients.length} clients, ${data.projects.length} projects). Continue?`))) { ev.target.value = ''; return; }

    for (const store of ['clients', 'projects', 'payments', 'expenses', 'followups']) {
      await dbClear(store);
      for (const rec of (data[store] || [])) await dbPut(store, rec);
    }
    await loadAll(); toast('Data restored successfully'); route();
  } catch (e) { toast('Import failed: ' + e.message, 'error'); }
  ev.target.value = '';
}

async function wipeAll() {
  if (!(await confirmAction('WARNING: This will permanently delete ALL data (clients, projects, payments, expenses, follow-ups). This cannot be undone. Proceed?'))) return;
  try {
    for (const s of ['clients', 'projects', 'payments', 'expenses', 'followups']) await dbClear(s);
    await localDB('clear', 'activity');
    S.activity = [];
    await loadAll(); toast('All data wiped'); route();
  } catch (e) { toast('Wipe failed: ' + e.message, 'error'); }
}

(async function init() {
  try {
    await openDB();
    buildNav();
    await loadAll();

      $('#sync-status').innerHTML = 'Mode: <span style="color:var(--success)">☁️ Cloud</span>';
      try {
        supabaseClient.channel('asviro-sync')
          .on('postgres_changes', { event: '*', schema: 'public' }, () => loadAll().then(() => route()))
          .subscribe();
      } catch (e) { console.warn('Realtime subscription failed', e); }
    } else {
      $('#sync-status').innerHTML = 'Mode: <span style="color:var(--warning)">💾 Local</span>';
    }

    if (!location.hash) location.hash = '#/dashboard';
    route();
  } catch (err) {
    console.error(err);
    $('#content').innerHTML = `<div class="empty"><h3>Failed to start</h3><p>${esc(err.message)}</p><button class="btn btn-primary mt-2" onclick="location.reload()">Reload</button></div>`;
  }
})();
