<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#0a0e1a">
<title>ClientDesk — Client & Payment Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0a0e1a; --surface:#121a2e; --surface2:#1a2440; --border:#22304f;
  --primary:#3b82f6; --primary2:#2563eb; --accent:#22d3ee;
  --text:#e6eefc; --muted:#8a9bb8;
  --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow-x:hidden}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:10px 12px;
  background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none;
  transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
input:invalid,select:invalid{border-color:var(--danger)}
::placeholder{color:#5a6b8a}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--surface);border-right:1px solid var(--border);
  position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100;
  transition:transform .25s ease;display:flex;flex-direction:column}
.sidebar .brand{padding:20px 20px 16px;font-size:20px;font-weight:800;letter-spacing:-.5px;
  background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;
  background-clip:text;color:transparent}
.sidebar nav{flex:1;padding:8px}
.sidebar nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;
  color:var(--muted);font-weight:500;margin-bottom:2px;transition:background .15s,color .15s}
.sidebar nav a:hover{background:var(--surface2);color:var(--text)}
.sidebar nav a.active{background:linear-gradient(90deg,rgba(59,130,246,.18),rgba(34,211,238,.08));
  color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.sidebar .icon{width:20px;text-align:center;font-size:16px}
.sidebar .foot{padding:14px 20px;font-size:11px;color:var(--muted);border-top:1px solid var(--border)}
.main{flex:1;margin-left:250px;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:rgba(10,14,26,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:12px 20px}
.topbar h1{font-size:18px;margin:0;font-weight:700;flex-shrink:0}
.topbar .search{flex:1;max-width:420px;position:relative}
.topbar .search input{padding-left:34px;background:var(--surface)}
.topbar .search::before{content:"🔍";position:absolute;left:11px;top:50%;transform:translateY(-50%);
  font-size:13px;opacity:.6}
.hamburger{display:none;font-size:22px;padding:4px 8px}
.content{padding:20px;flex:1}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99}
.overlay.show{display:block}

/* Cards */
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;transition:border-color .15s}
.card.clickable{cursor:pointer}
.card.clickable:hover{border-color:var(--primary)}
.stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.stat-value{font-size:22px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.stat-value.pos{color:var(--success)}
.stat-value.neg{color:var(--danger)}
.stat-value.warn{color:var(--warning)}
.stat-sub{font-size:12px;color:var(--muted);margin-top:4px}
.section-title{font-size:16px;font-weight:700;margin:24px 0 12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:9px;
  font-weight:600;font-size:13px;transition:transform .08s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
.btn-primary:hover{filter:brightness(1.1)}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--primary)}
.btn-danger{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.35)}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-success{background:rgba(16,185,129,.15);color:#6ee7b7;border:1px solid rgba(16,185,129,.35)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:7px}
.icon-btn{padding:6px 8px;border-radius:7px;font-size:14px;opacity:.75}
.icon-btn:hover{opacity:1;background:var(--surface2)}

/* Badges */
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:700;
  letter-spacing:.3px;white-space:nowrap}
.badge.gray{background:rgba(138,155,184,.15);color:#b4c1d9}
.badge.blue{background:rgba(59,130,246,.18);color:#93c5fd}
.badge.cyan{background:rgba(34,211,238,.18);color:#67e8f9}
.badge.green{background:rgba(16,185,129,.18);color:#6ee7b7}
.badge.yellow{background:rgba(245,158,11,.18);color:#fcd34d}
.badge.red{background:rgba(239,68,68,.18);color:#fca5a5}
.badge.purple{background:rgba(168,85,247,.18);color:#d8b4fe}

/* Tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;
  border:1px solid var(--border);background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
  font-weight:700;background:var(--surface2);position:sticky;top:0}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--surface2)}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* Empty states */
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .icon{font-size:42px;margin-bottom:10px;opacity:.5}
.empty h3{margin:0 0 6px;color:var(--text);font-size:15px}
.empty p{margin:0 0 14px;font-size:13px}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;
  color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.form-grid label.full{grid-column:1/-1}
.form-grid label input,.form-grid label select,.form-grid label textarea{
  text-transform:none;letter-spacing:0;font-weight:400;color:var(--text)}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;
  padding-top:16px;border-top:1px solid var(--border)}
.form-error{color:var(--danger);font-size:12px;margin-top:8px;display:none}
.form-error.show{display:block}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;
  align-items:flex-end;justify-content:center;padding:0;overflow-y:auto;animation:fade .2s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;
  width:100%;max-width:640px;max-height:92vh;overflow-y:auto;animation:slideUp .25s}
.modal.wide{max-width:820px}
@keyframes fade{from{opacity:0}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:2}
.modal-header h2{margin:0;font-size:17px;font-weight:700}
.modal-body{padding:18px 20px 22px}
@media(min-width:640px){
  .modal-overlay{align-items:center;padding:20px}
  .modal{border-radius:16px}
}

/* Toast */
#toasts{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface2);border:1px solid var(--border);padding:11px 16px;border-radius:10px;
  font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:slideIn .25s;
  max-width:320px}
.toast.success{border-color:rgba(16,185,129,.4)}
.toast.error{border-color:rgba(239,68,68,.4)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}}

/* Tabs / filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.filters input,.filters select{padding:8px 10px;font-size:13px;width:auto;min-width:140px}
.chip{padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--border);
  background:var(--surface2);color:var(--muted);cursor:pointer;transition:.15s}
.chip.active{background:rgba(59,130,246,.2);color:#93c5fd;border-color:var(--primary)}

/* Progress */
.progress{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:8px}
.progress > div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));
  border-radius:99px;transition:width .4s}

/* Client profile header */
.profile-head{background:linear-gradient(135deg,var(--surface),var(--surface2));
  border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.profile-head h2{margin:0 0 6px;font-size:22px}
.profile-head .meta{color:var(--muted);font-size:13px}

/* Chart */
.chart-box{position:relative;height:260px;padding:10px}
.chart-box canvas{max-height:100%}

/* Responsive */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .hamburger{display:block}
  .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr}
  .content{padding:14px}
  .topbar h1{font-size:16px}
}
@media(max-width:520px){
  .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .topbar .search{display:none}
  .stat-value{font-size:19px}
}
.mt-1{margin-top:8px}.mt-2{margin-top:16px}.mt-3{margin-top:24px}
.flex{display:flex}.between{justify-content:space-between}.center{align-items:center}.gap{gap:10px}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">ClientDesk</div>
    <nav id="nav"></nav>
    <div class="foot">Local mode · IndexedDB<br>Back up regularly from Settings</div>
  </aside>
  <div class="overlay" id="overlay"></div>
  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Menu">☰</button>
      <h1 id="page-title">Dashboard</h1>
      <div class="search"><input id="global-search" placeholder="Search clients, phone, projects…" autocomplete="off"></div>
      <button class="btn btn-primary" id="quick-add">+ New</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="toasts"></div>
<script>
'use strict';
/* ============================================================
   ClientDesk — Complete Client & Payment Tracker
   Local-first (IndexedDB). All calculations dynamic.
   ============================================================ */

/* ---------- Utilities ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtMoney = n => '₹' + (Number(n)||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtMoneyS = n => '₹' + (Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:0});
const fmtDate = d => { if(!d) return '—'; const dt = new Date(d); if(isNaN(dt)) return '—';
  return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a))/86400000);

function toast(msg, type='success'){
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2800);
}

function confirmAction(msg){
  return new Promise(res => {
    const o = document.createElement('div');
    o.className = 'modal-overlay';
    o.innerHTML = `<div class="modal" style="max-width:420px">
      <div class="modal-header"><h2>Confirm</h2></div>
      <div class="modal-body">
        <p style="margin:0 0 16px;color:var(--muted)">${esc(msg)}</p>
        <div class="form-actions">
          <button class="btn btn-ghost" data-no>Cancel</button>
          <button class="btn btn-danger" data-yes>Confirm</button>
        </div>
      </div></div>`;
    document.body.appendChild(o);
    o.querySelector('[data-no]').onclick = () => { o.remove(); res(false); };
    o.querySelector('[data-yes]').onclick = () => { o.remove(); res(true); };
    o.addEventListener('click', e => { if(e.target===o){ o.remove(); res(false);} });
  });
}

function openModal(title, bodyHtml, opts={}){
  const o = document.createElement('div');
  o.className = 'modal-overlay';
  o.innerHTML = `<div class="modal ${opts.wide?'wide':''}">
    <div class="modal-header"><h2>${esc(title)}</h2>
      <button class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="modal-body">${bodyHtml}</div>
  </div>`;
  document.body.appendChild(o);
  const close = () => o.remove();
  o.querySelector('[data-close]').onclick = close;
  o.addEventListener('click', e => { if(e.target===o) close(); });
  return { overlay:o, close, body:o.querySelector('.modal-body') };
}

/* ---------- DB ---------- */
const DB_NAME='clientdesk_v1', DB_VERSION=1;
let _db;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      ['clients','projects','payments','expenses','followups','audit'].forEach(s=>{
        if(!db.objectStoreNames.contains(s)) db.createObjectStore(s,{keyPath:'id'});
      });
    };
    r.onsuccess = e => { _db = e.target.result; res(_db); };
    r.onerror = e => rej(e.target.error);
  });
}
const dbAll = store => new Promise((res,rej)=>{ const r=_db.transaction(store).objectStore(store).getAll();
  r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); });
const dbPut = (store,obj) => new Promise((res,rej)=>{ const r=_db.transaction(store,'readwrite').objectStore(store).put(obj);
  r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error); });
const dbDel = (store,id) => new Promise((res,rej)=>{ const r=_db.transaction(store,'readwrite').objectStore(store).delete(id);
  r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
const dbClear = store => new Promise((res,rej)=>{ const r=_db.transaction(store,'readwrite').objectStore(store).clear();
  r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });

/* ---------- State ---------- */
const S = { clients:[], projects:[], payments:[], expenses:[], followups:[], audit:[] };
async function loadAll(){
  [S.clients,S.projects,S.payments,S.expenses,S.followups,S.audit] = await Promise.all(
    ['clients','projects','payments','expenses','followups','audit'].map(dbAll));
}
async function nextDisplayId(store, prefix){
  const all = await dbAll(store);
  let max = 0;
  all.forEach(r => { const m = (r.displayId||'').match(/(\d+)$/); if(m) max = Math.max(max, +m[1]); });
  return prefix + '-' + String(max+1).padStart(4,'0');
}
async function auditLog(entity, entityId, action, details){
  await dbPut('audit', { id:uid(), timestamp:new Date().toISOString(), entity, entityId, action, details });
}

/* ---------- Calculations (dynamic, from records) ---------- */
const Calc = {
  projReceived(projectId){
    return S.payments
      .filter(p => p.projectId===projectId && p.status==='Confirmed')
      .reduce((s,p)=> s + (p.type==='Refund' ? -p.amount : p.amount), 0);
  },
  projBalance(project){ return (project.agreedPrice||0) - Calc.projReceived(project.id); },
  projExpenses(project){
    const linked = S.expenses.filter(e=>e.projectId===project.id).reduce((s,e)=>s+(e.amount||0),0);
    return (project.domainCost||0)+(project.hostingCost||0)+(project.otherExpenses||0)+linked;
  },
  projNet(project){ return Calc.projReceived(project.id) - Calc.projExpenses(project); },
  projPayStatus(project){
    const rec = Calc.projReceived(project.id);
    if(rec<=0 && !S.payments.some(p=>p.projectId===project.id && p.status==='Confirmed')) return 'Unpaid';
    if(rec<=0) return 'Unpaid';
    if(rec < project.agreedPrice) return 'Partially Paid';
    if(rec === project.agreedPrice) return 'Paid';
    return 'Overpaid';
  },
  clientProjects(clientId){ return S.projects.filter(p=>p.clientId===clientId); },
  clientAgreed(clientId){ return Calc.clientProjects(clientId).reduce((s,p)=>s+(p.agreedPrice||0),0); },
  clientReceived(clientId){
    return S.payments.filter(p=>p.clientId===clientId && p.status==='Confirmed')
      .reduce((s,p)=>s+(p.type==='Refund'?-p.amount:p.amount),0);
  },
  clientExpenses(clientId){
    const direct = S.expenses.filter(e=>e.clientId===clientId).reduce((s,e)=>s+(e.amount||0),0);
    const proj = Calc.clientProjects(clientId).reduce((s,p)=>
      s+(p.domainCost||0)+(p.hostingCost||0)+(p.otherExpenses||0),0);
    return direct + proj;
  },
  clientOutstanding(clientId){ return Calc.clientAgreed(clientId) - Calc.clientReceived(clientId); },
  totalAgreed(){ return S.projects.filter(p=>p.status!=='Cancelled').reduce((s,p)=>s+(p.agreedPrice||0),0); },
  totalReceived(){ return S.payments.filter(p=>p.status==='Confirmed')
      .reduce((s,p)=>s+(p.type==='Refund'?-p.amount:p.amount),0); },
  totalExpenses(){
    const e = S.expenses.reduce((s,x)=>s+(x.amount||0),0);
    const p = S.projects.reduce((s,x)=>s+(x.domainCost||0)+(x.hostingCost||0)+(x.otherExpenses||0),0);
    return e + p;
  },
  totalOutstanding(){
    return S.projects.reduce((s,p)=>{ const b=Calc.projBalance(p); return s + (b>0?b:0); },0);
  },
  netCash(){ return Calc.totalReceived() - Calc.totalExpenses(); },
  overdueAmount(){
    const today = todayStr();
    return S.projects.reduce((s,p)=>{
      const b = Calc.projBalance(p);
      return s + (b>0 && p.deadline && p.deadline < today ? b : 0);
    },0);
  },
  activeProjects(){ return S.projects.filter(p=>['Not Started','In Progress','Waiting for Client','Revision'].includes(p.status)); },
  completedProjects(){ return S.projects.filter(p=>['Completed','Delivered'].includes(p.status)); },
  upcomingDeadlines(days=14){
    const today = todayStr();
    return S.projects.filter(p=>p.deadline && p.deadline>=today && p.deadline<=addDays(today,days) &&
      !['Completed','Delivered','Cancelled'].includes(p.status));
  },
  followupsDueToday(){
    const today = todayStr();
    return S.followups.filter(f=>f.status==='Pending' && f.date<=today);
  },
  overdueDeadlines(){
    const today = todayStr();
    return S.projects.filter(p=>p.deadline && p.deadline<today &&
      !['Completed','Delivered','Cancelled'].includes(p.status));
  }
};
function addDays(dateStr, n){ const d=new Date(dateStr); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }

/* ---------- Charts ---------- */
let chartInstances = {};
function destroyCharts(){ Object.values(chartInstances).forEach(c=>c&&c.destroy()); chartInstances={}; }
function makeChart(id, config){
  const el = document.getElementById(id); if(!el) return;
  chartInstances[id] = new Chart(el, config);
}
const chartDefaults = () => ({
  color: '#8a9bb8',
  borderColor: '#22304f',
});
Chart.defaults.color = '#8a9bb8';
Chart.defaults.borderColor = '#22304f';
Chart.defaults.font.family = "-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif";

/* ---------- Router ---------- */
const routes = {
  dashboard: renderDashboard,
  clients: renderClients,
  client: renderClientProfile,
  projects: renderProjects,
  payments: renderPayments,
  expenses: renderExpenses,
  followups: renderFollowups,
  reports: renderReports,
  settings: renderSettings
};
let currentRoute = 'dashboard';

function route(){
  const hash = location.hash.slice(1) || '/dashboard';
  const parts = hash.split('/').filter(Boolean);
  const name = parts[0] || 'dashboard';
  currentRoute = name;
  const fn = routes[name] || renderDashboard;
  destroyCharts();
  fn(parts.slice(1));
  // active nav
  $$('#nav a').forEach(a=>a.classList.toggle('active', a.dataset.route===name));
  // close mobile sidebar
  $('#sidebar').classList.remove('open');
  $('#overlay').classList.remove('show');
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

/* ---------- Layout / Nav ---------- */
const NAV = [
  {route:'dashboard', icon:'📊', label:'Dashboard'},
  {route:'clients', icon:'👥', label:'Clients'},
  {route:'projects', icon:'🗂️', label:'Projects'},

   DASHBOARD
   ============================================================ */
function renderDashboard(){
  $('#page-title').textContent = 'Dashboard';

  const active = Calc.activeProjects().length;
  const completed = Calc.completedProjects().length;

  const received = Calc.totalReceived();

  const overdue = Calc.overdueAmount();
  const expenses = Calc.totalExpenses();
  const netCash = Calc.netCash();
  const deadlines = Calc.upcomingDeadlines(14);
  const followups = Calc.followupsDueToday();

  const el = $('#content');
  el.innerHTML = `
    <div class="grid cols-4">
      ${statCard('Total Clients', totalClients, '', '')}
      ${statCard('Active Projects', active, '', '')}
      ${statCard('Completed Projects', completed, '', 'pos')}

      ${statCard('Overdue Amount', fmtMoneyS(overdue), '', overdue>0?'neg':'')}
      ${statCard('Total Expenses', fmtMoneyS(expenses), '', '')}

    <div class="grid cols-2">
      <div class="card"><div class="stat-label">Monthly Payments Received</div>
        <div class="chart-box"><canvas id="chart-payments"></canvas></div></div>
      <div class="card"><div class="stat-label">Monthly Expenses</div>
        <div class="chart-box"><canvas id="chart-expenses"></canvas></div></div>
      <div class="card"><div class="stat-label">Project Status Distribution</div>
        <div class="chart-box"><canvas id="chart-status"></canvas></div></div>
      <div class="card"><div class="stat-label">Outstanding by Client</div>
        <div class="chart-box"><canvas id="chart-outstanding"></canvas></div></div>
    </div>

    <h3 class="section-title">Reminders</h3>

      <div class="card">
        <div class="flex between center" style="margin-bottom:12px">
          <div class="stat-label">Upcoming Deadlines</div>
          <button class="btn btn-sm btn-ghost" onclick="location.hash='#/projects'">View all</button>
        </div>
        ${deadlines.length ? deadlines.slice(0,5).map(p=>{
          const c = S.clients.find(x=>x.id===p.clientId);
          return `<div class="flex between center" style="padding:8px 0;border-bottom:1px solid var(--border)">
            <div><div style="font-weight:600">${esc(p.name)}</div>
              <div class="stat-sub">${esc(c?c.name:'—')} · Due ${fmtDate(p.deadline)}</div></div>
            <span class="badge ${daysBetween(todayStr(), p.deadline)<=3?'red':'yellow'}">
              ${daysBetween(todayStr(), p.deadline)}d</span>
          </div>`;
        }).join('') : `<div class="empty"><div class="icon">📅</div><p>No upcoming deadlines in next 14 days.</p></div>`}
      </div>
      <div class="card">
        <div class="flex between center" style="margin-bottom:12px">
          <div class="stat-label">Follow-ups Due</div>
          <button class="btn btn-sm btn-ghost" onclick="location.hash='#/followups'">View all</button>
        </div>
        ${followups.length ? followups.slice(0,5).map(f=>{
          const c = S.clients.find(x=>x.id===f.clientId);
          const overdue = f.date < todayStr();
          return `<div class="flex between center" style="padding:8px 0;border-bottom:1px solid var(--border)">
            <div><div style="font-weight:600">${esc(c?c.name:'—')}</div>
              <div class="stat-sub">${esc(f.purpose)} · ${fmtDate(f.date)}</div></div>
            <span class="badge ${overdue?'red':'yellow'}">${overdue?'Overdue':'Today'}</span>
          </div>`;
        }).join('') : `<div class="empty"><div class="icon">✅</div><p>No follow-ups due. You're on top of it!</p></div>`}
      </div>
    </div>
  `;

  // Charts
  const months = last6Months();
  const paymentsData = months.map(m => S.payments.filter(p=>p.status==='Confirmed' &&
    p.date && p.date.slice(0,7)===m).reduce((s,p)=>s+(p.type==='Refund'?-p.amount:p.amount),0));
  const expensesData = months.map(m => {
    const exp = S.expenses.filter(e=>e.date && e.date.slice(0,7)===m).reduce((s,e)=>s+(e.amount||0),0);
    return exp;
  });
  const monthLabels = months.map(m=>{
    const [y,mo]=m.split('-'); return new Date(y,mo-1).toLocaleDateString('en-IN',{month:'short',year:'2-digit'});

  if(paymentsData.some(v=>v>0)){

        scales:{y:{beginAtZero:true,ticks:{callback:v=>fmtMoneyS(v)}}}}
    });
  } else emptyChart('chart-payments','No payments recorded yet');

  if(expensesData.some(v=>v>0)){
    makeChart('chart-expenses',{ type:'bar',
      data:{labels:monthLabels,datasets:[{label:'Expenses',data:expensesData,
        backgroundColor:'rgba(239,68,68,.5)',borderColor:'#ef4444',borderWidth:1,borderRadius:6}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{y:{beginAtZero:true,ticks:{callback:v=>fmtMoneyS(v)}}}}
    });
  } else emptyChart('chart-expenses','No expenses recorded yet');

  const statusCounts = {};
  S.projects.forEach(p=>{ statusCounts[p.status]=(statusCounts[p.status]||0)+1; });
  const statusLabels = Object.keys(statusCounts);
  if(statusLabels.length){
    makeChart('chart-status',{ type:'doughnut',
      data:{labels:statusLabels,datasets:[{data:Object.values(statusCounts),
        backgroundColor:['#3b82f6','#22d3ee','#f59e0b','#a855f7','#10b981','#ef4444','#64748b']}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}
    });
  } else emptyChart('chart-status','No projects yet');

  const clientOutstanding = S.clients.map(c=>({name:c.name, bal:Calc.clientOutstanding(c.id)}))
    .filter(x=>x.bal>0).sort((a,b)=>b.bal-a.bal).slice(0,6);
  if(clientOutstanding.length){
    makeChart('chart-outstanding',{ type:'bar',
      data:{labels:clientOutstanding.map(x=>x.name),datasets:[{label:'Outstanding',
        data:clientOutstanding.map(x=>x.bal),backgroundColor:'rgba(245,158,11,.55)',
        borderColor:'#f59e0b',borderWidth:1,borderRadius:6}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{callback:v=>fmtMoneyS(v)}}}}
    });
  } else emptyChart('chart-outstanding','No outstanding balances');
}

function emptyChart(id, msg){
  const el = document.getElementById(id);
  if(!el) return;
  const parent = el.parentElement;
  parent.innerHTML = `<div class="empty" style="padding:80px 20px"><div class="icon">📭</div><p>${esc(msg)}</p></div>`;
}

function last6Months(){
  const arr=[]; const d=new Date();
  for(let i=5;i>=0;i--){ const x=new Date(d.getFullYear(), d.getMonth()-i, 1);
    arr.push(x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')); }
  return arr;
}
function statCard(label, value, sub, cls=''){
  return `<div class="card">
    <div class="stat-label">${esc(label)}</div>
    <div class="stat-value ${cls}">${esc(String(value))}</div>
    ${sub?`<div class="stat-sub">${esc(sub)}</div>`:''}
  </div>`;
}

   CLIENTS LIST
   ============================================================ */
function renderClients(parts){
  $('#page-title').textContent = 'Clients';
  const params = new URLSearchParams((location.hash.split('?')[1])||'');
  let q = params.get('q') || '';
  let category = params.get('cat') || '';
  let status = params.get('status') || '';
  let sort = params.get('sort') || 'newest';
  let showArchived = params.get('arch') === '1';

  let list = S.clients.filter(c => showArchived ? c.archived : !c.archived);
  if(q){
    const ql = q.toLowerCase();
    list = list.filter(c =>
      (c.name||'').toLowerCase().includes(ql) ||
      (c.owner||'').toLowerCase().includes(ql) ||
      (c.mobile||'').includes(ql) ||
      (c.displayId||'').toLowerCase().includes(ql) ||
      S.projects.some(p=>p.clientId===c.id && (p.name||'').toLowerCase().includes(ql))
    );
  }
  if(category) list = list.filter(c=>c.category===category);
  if(status) list = list.filter(c=>c.status===status);
  list.sort((a,b)=>{
    if(sort==='newest') return (b.createdAt||'').localeCompare(a.createdAt||'');
    if(sort==='oldest') return (a.createdAt||'').localeCompare(b.createdAt||'');
    if(sort==='outstanding') return Calc.clientOutstanding(b.id)-Calc.clientOutstanding(a.id);
    if(sort==='deadline'){
      const da = Math.min(...Calc.clientProjects(a.id).map(p=>p.deadline?new Date(p.deadline).getTime():Infinity));
      const db = Math.min(...Calc.clientProjects(b.id).map(p=>p.deadline?new Date(p.deadline).getTime():Infinity));
      return da-db;
    }
    if(sort==='payment'){
      const pa = Math.max(0,...S.payments.filter(p=>p.clientId===a.id).map(p=>new Date(p.date||0).getTime()));
      const pb = Math.max(0,...S.payments.filter(p=>p.clientId===b.id).map(p=>new Date(p.date||0).getTime()));
      return pb-pa;
    }
    return 0;
  });

  const categories = [...new Set(S.clients.map(c=>c.category).filter(Boolean))];
  const statuses = ['Lead','Contacted','Interested','Confirmed','Active','Completed','Cancelled'];

  $('#content').innerHTML = `
    <div class="filters">
      <input id="f-q" placeholder="Search clients…" value="${esc(q)}">
      <select id="f-cat"><option value="">All categories</option>
        ${categories.map(c=>`<option ${category===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <select id="f-status"><option value="">All statuses</option>
        ${statuses.map(s=>`<option ${status===s?'selected':''}>${esc(s)}</option>`).join('')}</select>
      <select id="f-sort">
        <option value="newest" ${sort==='newest'?'selected':''}>Newest first</option>
        <option value="oldest" ${sort==='oldest'?'selected':''}>Oldest first</option>
        <option value="outstanding" ${sort==='outstanding'?'selected':''}>Highest outstanding</option>
        <option value="deadline" ${sort==='deadline'?'selected':''}>Nearest deadline</option>
        <option value="payment" ${sort==='payment'?'selected':''}>Latest payment</option>
      </select>
      <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer">
        <input type="checkbox" id="f-arch" ${showArchived?'checked':''} style="width:auto"> Show archived
      </label>
      <button class="btn btn-primary" onclick="openClientForm()">+ Add Client</button>
    </div>
    ${list.length ? `
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>ID</th><th>Client</th><th>Contact</th><th>Projects</th>
            <th class="num">Outstanding</th><th>Status</th>
          </tr></thead>
          <tbody>
            ${list.map(c=>{
              const out = Calc.clientOutstanding(c.id);
              const pc = Calc.clientProjects(c.id).length;
              return `<tr onclick="location.hash='#/client/${c.id}'">
                <td><span class="badge gray">${esc(c.displayId)}</span></td>
                <td><strong>${esc(c.name)}</strong>${c.owner?`<div class="stat-sub">${esc(c.owner)}</div>`:''}</td>
                <td>${esc(c.mobile||'—')}<div class="stat-sub">${esc(c.city||'')}</div></td>
                <td>${pc}</td>
                <td class="num ${out>0?'':'pos'}" style="color:${out>0?'var(--warning)':'var(--success)'}">${fmtMoney(out)}</td>
                <td>${clientStatusBadge(c.status)}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>` :
      `<div class="empty"><div class="icon">👥</div>
        <h3>No clients yet</h3><p>Add your first client to get started.</p>
        <button class="btn btn-primary" onclick="openClientForm()">+ Add Client</button></div>`}
  `;

  const updateUrl = () => {
    const p = new URLSearchParams();
    const qv = $('#f-q').value.trim(); if(qv) p.set('q',qv);
    if($('#f-cat').value) p.set('cat',$('#f-cat').value);
    if($('#f-status').value) p.set('status',$('#f-status').value);
    if($('#f-sort').value!=='newest') p.set('sort',$('#f-sort').value);
    if($('#f-arch').checked) p.set('arch','1');
    location.hash = '#/clients'+(p.toString()?'?'+p.toString():'');
  };
  $('#f-q').addEventListener('input', debounce(updateUrl, 250));
  $('#f-cat').addEventListener('change', updateUrl);
  $('#f-status').addEventListener('change', updateUrl);
  $('#f-sort').addEventListener('change', updateUrl);
  $('#f-arch').addEventListener('change', updateUrl);
}
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }

function clientStatusBadge(s){
  const map = {Lead:'gray',Contacted:'blue',Interested:'cyan',Confirmed:'purple',
    Active:'green',Completed:'green',Cancelled:'red'};
  return `<span class="badge ${map[s]||'gray'}">${esc(s||'—')}</span>`;
}
function projectStatusBadge(s){
  const map = {'Not Started':'gray','In Progress':'blue','Waiting for Client':'yellow',
    'Revision':'purple','Completed':'green','Delivered':'green','Cancelled':'red'};
  return `<span class="badge ${map[s]||'gray'}">${esc(s||'—')}</span>`;
}
function payStatusBadge(s){
  const map = {Unpaid:'red','Partially Paid':'yellow',Paid:'green',Overpaid:'cyan'};
  return `<span class="badge ${map[s]||'gray'}">${esc(s)}</span>`;
}

function row(label, href, value){
  return `<div><strong style="color:var(--muted);font-weight:600;display:inline-block;min-width:90px">${esc(label)}</strong>
    ${href?`<a href="${esc(href)}" target="_blank" rel="noopener">${esc(value)}</a>`:esc(value)}</div>`;
}
function waLink(number, message){
  const n = (number||'').replace(/\D/g,'');
  if(!n) return '#';
  return `https://wa.me/${n}${message?'?text='+encodeURIComponent(message):''}`;
}
function parseLinks(text){
  return (text||'').split('\n').map(line=>{
    const [a,b] = line.split('|').map(s=>s.trim());
    if(!a) return null;
    return b ? {label:a, url:b} : {label:a, url:''};
  }).filter(Boolean);
}

function exportJSON(){
  const data = {
    _app: 'ClientDesk', _version: 1, _exportedAt: new Date().toISOString(),
    clients: S.clients, projects: S.projects, payments: S.payments,
    expenses: S.expenses, followups: S.followups, audit: S.audit
  };
  downloadFile('clientdesk-backup-'+todayStr()+'.json', JSON.stringify(data, null, 2), 'application/json');
  toast('Backup downloaded');
}

async function importJSON(ev){
  const file = ev.target.files[0]; if(!file) return;
  const ok = await confirmAction('Importing will merge records. Records with the same internal ID will be overwritten. Export a backup first if unsure. Continue?');
  ev.target.value = '';
  if(!ok) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data || typeof data !== 'object') throw new Error('Invalid file');
    let counts = {clients:0,projects:0,payments:0,expenses:0,followups:0};
    for(const store of ['clients','projects','payments','expenses','followups']){
      for(const rec of (data[store]||[])){
        if(!rec.id) continue;
        await dbPut(store, rec); counts[store]++;
      }
    }
    await auditLog('data','all','import',counts);
    await loadAll(); toast('Import complete'); route();
  } catch(e) {
    toast('Import failed: '+e.message, 'error');
  }
}

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 100);
}

function exportCSV(store){
  const rows = S[store];
  if(!rows.length){ toast('No data to export','error'); return; }
  const keys = [...new Set(rows.flatMap(r=>Object.keys(r)))];
  const csv = [
    keys.join(','),
    ...rows.map(r => keys.map(k => {
      let v = r[k]; if(v==null) v=''; if(typeof v==='object') v=JSON.stringify(v);
      return '"'+String(v).replace(/"/g,'""')+'"';
    }).join(','))
  ].join('\n');
  downloadFile('clientdesk-'+store+'-'+todayStr()+'.csv', csv, 'text/csv');
  toast(store+' exported');
}

async function wipeAll(){
  const ok = await confirmAction('This will permanently delete ALL clients, projects, payments, expenses, follow-ups, and audit logs on this device. This cannot be undone. Continue?');
  if(!ok) return;
  const ok2 = await confirmAction('FINAL WARNING: All data will be gone. Type yes by pressing Confirm to proceed.');
  if(!ok2) return;
  for(const s of ['clients','projects','payments','expenses','followups','audit']) await dbClear(s);
  await loadAll(); toast('All data deleted'); route();
}

async function deleteClient(id){
  const c = S.clients.find(x=>x.id===id); if(!c) return;
  const projCount = S.projects.filter(p=>p.clientId===id).length;
  const payCount = S.payments.filter(p=>p.clientId===id).length;
  const ok = await confirmAction(
    `Delete "${c.name}"? This will also delete ${projCount} project(s), ${payCount} payment(s), and all related follow-ups and expenses. This cannot be undone.`);
  if(!ok) return;
  for(const p of S.projects.filter(x=>x.clientId===id)) await dbDel('projects', p.id);
  for(const p of S.payments.filter(x=>x.clientId===id)) await dbDel('payments', p.id);
  for(const e of S.expenses.filter(x=>x.clientId===id)) await dbDel('expenses', e.id);
  for(const f of S.followups.filter(x=>x.clientId===id)) await dbDel('followups', f.id);
  await dbDel('clients', id);
  await auditLog('client', id, 'deleted', {name:c.name, projects:projCount, payments:payCount});
  await loadAll(); toast('Client deleted');
  location.hash = '#/clients';
}

  const expCount = S.expenses.filter(x=>x.projectId===id).length;
  const msg = payCount > 0 || expCount > 0
    ? `Delete project "${p.name}"? It has ${payCount} payment(s) and ${expCount} expense(s) linked. This will permanently remove them all. Consider archiving instead by changing its status to Cancelled.`
    : `Delete project "${p.name}"? This cannot be undone.`;
  const ok = await confirmAction(msg);
  if(!ok) return;
  for(const pay of S.payments.filter(x=>x.projectId===id)) await dbDel('payments', pay.id);
  for(const ex of S.expenses.filter(x=>x.projectId===id)) await dbDel('expenses', ex.id);
  await dbDel('projects', id);
  await auditLog('project', id, 'deleted', {name:p.name, payments:payCount, expenses:expCount});

        <input name="date" type="date" required value="${esc(p.date||todayStr())}"></label>
      <label>Payment Method
        <select name="method">
          ${['Cash','UPI','Bank Transfer','Card','Other'].map(m=>`<option ${(p.method||'UPI')===m?'selected':''}>${m}</option>`).join('')}
        </select></label>
      <label>Purpose
        <select name="purpose">
          ${['Advance','Milestone','Final Payment','Other'].map(m=>`<option ${(p.purpose||'Advance')===m?'selected':''}>${m}</option>`).join('')}
        </select></label>
      <label>Transaction / Reference ID
        <input name="refId" value="${esc(p.refId||'')}" placeholder="Optional"></label>
      <label class="full">Notes
        <textarea name="notes" rows="2">${esc(p.notes||'')}</textarea></label>
      <label>Payment Status
        <select name="status">
          <option value="Confirmed" ${(p.status||'Confirmed')==='Confirmed'?'selected':''}>Confirmed (counts as received)</option>
          <option value="Pending" ${p.status==='Pending'?'selected':''}>Pending (does not count)</option>
        </select></label>
      <div class="form-error" id="payf-err"></div>
      <div class="form-actions full">
        <button type="button" class="btn btn-ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn btn-primary" data-submit>${id?'Save Changes':'Record Payment'}</button>
      </div>
    </form>
  `, {wide:true});
  document.querySelector('[data-cancel]').onclick = close;

  const clientSel = document.querySelector('[name=clientId]');
  const projSel = document.querySelector('[name=projectId]');
  clientSel.onchange = () => {
    const cid = clientSel.value;
    const plist = S.projects.filter(x=>x.clientId===cid);
    projSel.innerHTML = '<option value="">Select project…</option>' +
      plist.map(pr=>`<option value="${pr.id}">${esc(pr.name)}</option>`).join('');
  };

  const form = document.getElementById('payment-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('[data-submit]');
    const err = document.getElementById('payf-err');
    err.classList.remove('show'); btn.disabled = true;
    try {
      const data = Object.fromEntries(new FormData(form).entries());
      const amount = parseFloat(data.amount);
      if(isNaN(amount) || amount <= 0) throw new Error('Amount must be greater than 0');
      if(!data.clientId) throw new Error('Select a client');
      if(!data.projectId) throw new Error('Select a project');
      if(!data.date || isNaN(new Date(data.date))) throw new Error('Enter a valid date');

      // duplicate protection
      if(!id){
        const dup = S.payments.find(x =>
          x.projectId===data.projectId && x.amount===amount && x.date===data.date &&
          x.method===data.method && (x.refId||'')===(data.refId||'') && x.status===data.status);
        if(dup){
          const proceed = await confirmAction('An identical payment already exists ('+dup.displayId+'). Add anyway?');
          if(!proceed){ btn.disabled=false; return; }
        }
      }

      // refund guard
      if(data.type==='Refund'){
        const proj = S.projects.find(x=>x.id===data.projectId);
        const current = Calc.projReceived(data.projectId);
        if(current - amount < 0){
          const go = await confirmAction(`This refund exceeds received amount. Received: ${fmtMoney(current)}, refund: ${fmtMoney(amount)}. Project would show negative received. Continue?`);
          if(!go){ btn.disabled=false; return; }
        }
      }

      const rec = {
        id: p.id || uid(),
        displayId: p.displayId || await nextDisplayId('payments','RC'),
        createdAt: p.createdAt || new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        clientId: data.clientId, projectId: data.projectId,
        type: data.type, amount, date: data.date, method: data.method,
        purpose: data.purpose, refId: data.refId, notes: data.notes, status: data.status
      };
      if(id && p){ await auditLog('payment', p.id, 'updated', {old: {...p}, new: {...rec}}); }
      else { await auditLog('payment', rec.id, 'created', {amount, projectId: rec.projectId}); }
      await dbPut('payments', rec);
      await loadAll();
      close();
      toast(id?'Payment updated':'Payment recorded');
      route();
    } catch(ex){
      err.textContent = ex.message; err.classList.add('show');
    } finally { btn.disabled = false; }
  });
}

function openFollowupForm(id, presetClientId){
  const f = id ? S.followups.find(x=>x.id===id) : {clientId:presetClientId};
  if(id && !f) return;
  if(!S.clients.length){ toast('Add a client first','error'); return; }
  const { close } = openModal(id?'Edit Follow-up':'Add Follow-up', `
    <form id="fu-form" class="form-grid">
      <label>Client *
        <select name="clientId" required>
          ${S.clients.filter(c=>!c.archived).map(c=>`<option value="${c.id}" ${f.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
        </select></label>
      <label>Follow-up Date *
        <input name="date" type="date" required value="${esc(f.date||todayStr())}"></label>
      <label class="full">Purpose *
        <input name="purpose" required value="${esc(f.purpose||'')}" placeholder="e.g. Discuss final payment"></label>
      <label>Status
        <select name="status">
          ${['Pending','Completed','Rescheduled'].map(s=>`<option ${(f.status||'Pending')===s?'selected':''}>${s}</option>`).join('')}
        </select></label>
      <label>Next Follow-up Date
        <input name="nextDate" type="date" value="${esc(f.nextDate||'')}"></label>
      <label class="full">Notes
        <textarea name="notes" rows="2">${esc(f.notes||'')}</textarea></label>
      <div class="form-error" id="fuf-err"></div>
      <div class="form-actions full">
        <button type="button" class="btn btn-ghost" data-cancel>Cancel</button>
        <button type="submit" class="btn btn-primary" data-submit>${id?'Save Changes':'Add Follow-up'}</button>
      </div>
    </form>
  `, {wide:true});
  document.querySelector('[data-cancel]').onclick = close;
  const form = document.getElementById('fu-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('[data-submit]');
    const err = document.getElementById('fuf-err');
    err.classList.remove('show'); btn.disabled = true;
    try {
      const data = Object.fromEntries(new FormData(form).entries());
      if(!data.clientId) throw new Error('Select a client');
      if(!data.purpose.trim()) throw new Error('Purpose is required');
      const rec = {
        id: f.id || uid(),
        displayId: f.displayId || await nextDisplayId('followups','FU'),
        createdAt: f.createdAt || new Date().toISOString(),
        clientId: data.clientId, date: data.date, purpose: data.purpose.trim(),
        status: data.status, nextDate: data.nextDate, notes: data.notes
      };
      await dbPut('followups', rec);
      await loadAll(); close(); toast(id?'Follow-up updated':'Follow-up added'); route();
    } catch(ex){
      err.textContent = ex.message; err.classList.add('show');
    } finally { btn.disabled = false; }
  });
}

async function deleteFollowup(id){
  const ok = await confirmAction('Delete this follow-up?');
  if(!ok) return;
  await dbDel('followups', id);
  await loadAll(); toast('Follow-up deleted'); route();
}

h1{font-size:24px;margin:0 0 6px;color:#1a3b7c}

function printHtml(html){
  const w = window.open('', '_blank');
  if(!w){ toast('Please allow pop-ups to print','error'); return; }
  w.document.write(`<!DOCTYPE html><html><head><title>Print</title><style>${printCss}</style></head><body>${html}<div class="foot">Generated by ClientDesk · ${new Date().toLocaleString('en-IN')}</div></body></html>`);
  w.document.close();
  setTimeout(()=>{ w.focus(); w.print(); }, 400);
}

function printReceipt(paymentId){
  const p = S.payments.find(x=>x.id===paymentId); if(!p) return;
  const c = S.clients.find(x=>x.id===p.clientId);
  const proj = S.projects.find(x=>x.id===p.projectId);
  const bal = proj ? Calc.projBalance(proj) : 0;
  const html = `
    <h1>ClientDesk</h1>
    <div style="color:#555;font-size:13px">Payment Receipt</div>
    <h2>Receipt ${esc(p.displayId)}</h2>
    <div class="row"><span class="label">Date</span><span>${fmtDate(p.date)}</span></div>
    <div class="row"><span class="label">Client</span><span>${esc(c?c.name:'—')}</span></div>
    <div class="row"><span class="label">Project</span><span>${esc(proj?proj.name:'—')}</span></div>
    <div class="row"><span class="label">Type / Purpose</span><span>${esc(p.type||'Payment')} · ${esc(p.purpose||'—')}</span></div>
    <div class="row"><span class="label">Payment Method</span><span>${esc(p.method||'—')}</span></div>
    ${p.refId?`<div class="row"><span class="label">Reference</span><span>${esc(p.refId)}</span></div>`:''}
    <div class="row" style="margin-top:12px;padding-top:12px;border-top:2px solid #1a3b7c">
      <span class="label">Amount</span><span class="big">${p.type==='Refund'?'-':''}${fmtMoney(p.amount)}</span></div>
    <div class="row"><span class="label">Status</span><span>${esc(p.status)}</span></div>
    ${proj?`<div class="row"><span class="label">Remaining Balance</span><span class="total">${fmtMoney(bal)}</span></div>`:''}
    ${p.notes?`<h2 style="font-size:13px;margin-top:20px">Notes</h2><div style="font-size:13px">${esc(p.notes)}</div>`:''}
  `;
  printHtml(html);
}

function openInvoice(projectId){
  const p = S.projects.find(x=>x.id===projectId); if(!p) return;
  const c = S.clients.find(x=>x.id===p.clientId);
  const payments = S.payments.filter(x=>x.projectId===p.id && x.status==='Confirmed');
  const rec = Calc.projReceived(p.id);
  const bal = Calc.projBalance(p);
  const html = `
    <h1>ClientDesk</h1>
    <div style="color:#555;font-size:13px">Invoice / Quotation · ${esc(p.displayId)}</div>
    <h2>Project Invoice</h2>
    <div class="row"><span class="label">Client</span><span>${esc(c?c.name:'—')}</span></div>
    <div class="row"><span class="label">Project</span><span>${esc(p.name)}</span></div>
    <div class="row"><span class="label">Date</span><span>${fmtDate(todayStr())}</span></div>
    <div class="row"><span class="label">Deadline</span><span>${fmtDate(p.deadline)}</span></div>
    <h2>Charges</h2>
    <table><thead><tr><th>Description</th><th class="num">Amount</th></tr></thead><tbody>
      <tr><td>${esc(p.type||'Website')} — ${esc(p.name)}</td><td class="num">${fmtMoney(p.agreedPrice)}</td></tr>
    </tbody></table>
    <div class="row"><span class="label">Agreed Total</span><span class="total">${fmtMoney(p.agreedPrice)}</span></div>
    ${payments.length?`
      <h2>Payments Received</h2>
      <table><thead><tr><th>Date</th><th>Receipt</th><th>Method</th><th class="num">Amount</th></tr></thead><tbody>
        ${payments.map(x=>`<tr><td>${fmtDate(x.date)}</td><td>${esc(x.displayId)}</td>
          <td>${esc(x.method)}</td><td class="num">${fmtMoney(x.amount)}</td></tr>`).join('')}
      </tbody></table>
      <div class="row"><span class="label">Total Received</span><span>${fmtMoney(rec)}</span></div>
      <div class="row"><span class="label">Balance Due</span><span class="total">${fmtMoney(bal)}</span></div>`:''}
  `;
  printHtml(html);
}

function printClientStatement(){
  const rows = S.clients.filter(c=>!c.archived).map(c=>{
    const agreed = Calc.clientAgreed(c.id);
    const rec = Calc.clientReceived(c.id);
    const exp = Calc.clientExpenses(c.id);
    const bal = Calc.clientOutstanding(c.id);
    return `<tr><td>${esc(c.name)}</td><td class="num">${fmtMoney(agreed)}</td>
      <td class="num">${fmtMoney(rec)}</td><td class="num">${fmtMoney(exp)}</td>
      <td class="num">${fmtMoney(bal)}</td></tr>`;
  }).join('');
  const html = `
    <h1>ClientDesk</h1>
    <h2>Client-Wise Statement</h2>
    <div style="font-size:12px;color:#555">Generated ${new Date().toLocaleString('en-IN')}</div>
    <table><thead><tr><th>Client</th><th class="num">Agreed</th><th class="num">Received</th>
      <th class="num">Expenses</th><th class="num">Balance</th></tr></thead><tbody>${rows}</tbody></table>
  `;
  printHtml(html);
}

function printMonthlySummary(){
  const now = new Date();
  const m = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  const rec = S.payments.filter(p=>p.status==='Confirmed' && (p.date||'').slice(0,7)===m)
    .reduce((s,p)=>s+(p.type==='Refund'?-p.amount:p.amount),0);
  const exp = S.expenses.filter(e=>(e.date||'').slice(0,7)===m)
    .reduce((s,e)=>s+(e.amount||0),0);
  const label = now.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  const html = `
    <h1>ClientDesk</h1>
    <h2>Monthly Financial Summary — ${label}</h2>
    <div class="row"><span class="label">Total Payments Received</span><span>${fmtMoney(rec)}</span></div>
    <div class="row"><span class="label">Total Expenses</span><span>${fmtMoney(exp)}</span></div>
    <div class="row" style="margin-top:12px;padding-top:12px;border-top:2px solid #1a3b7c">
      <span class="label">Net</span><span class="total">${fmtMoney(rec-exp)}</span></div>
  `;
  printHtml(html);
}
